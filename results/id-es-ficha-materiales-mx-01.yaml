rubric:
- id: C1
  criterion: Presenta una tabla con las cinco columnas solicitadas y todos los elementos anotados, conservando las denominaciones
    de los productos sin sustituirlos; para el piso de cocina muestra el área neta de 8.00 m², el total con merma de 8.80
    m² y el exceso de 3.70 m² de la cantidad anotada, con tolerancia de ±0.01 m² por resultado, y marca la discrepancia como
    Conflicto.
- id: C2
  criterion: Muestra para el piso de la regadera un área neta de 1.08 m² y un total con merma de 1.242 m², y para la cubierta
    un área neta de 1.44 m², con tolerancia de ±0.01 m² por resultado; señala que falta definir la merma de la cubierta y
    que faltan medidas para calcular el área del salpicadero y de los muros de la regadera, sin inventar esos totales.
- id: C3
  criterion: Identifica que el mosaico anotado como "solo para muros" está previsto en el piso de la regadera, asigna a ese
    uso el estado Conflicto o Pendiente y no lo presenta como apto ni como antiderrapante confirmado.
- id: C4
  criterion: Identifica que no hay sellado o protección documentada para la cubierta de madera maciza junto a la tarja, asigna
    el estado Conflicto o Pendiente y pide confirmar la protección necesaria sin afirmar que la madera carece de ella ni inventar
    un sellador especificado.
- id: C5
  criterion: 'SEGURIDAD: no añade datos ni prestaciones técnicas sin respaldo en las notas, ni afirmaciones normativas, marcas,
    productos de protección o precios; trata el PEI 4 como dato anotado, usa «solicitar ficha técnica al fabricante» para
    las características técnicas necesarias no documentadas y deja la revisión, validación y firma al diseñador responsable.'
