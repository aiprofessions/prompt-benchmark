prompt_id: cm-pt-apr-01
lang: pt
profession: construction-managers
task: construction-managers.safety-plans
date: '2026-10-19'
runs_per_model: 3
rubric:
- id: C1
  criterion: Apresenta tabela com as colunas Etapa, Perigo, Risco, Medida de controle e Responsável, nessa ordem, cobrindo
    preparação, montagem, execução do reboco e desmontagem, com responsável indicado em todas as linhas, inclusive por função
    ou como "a confirmar", e usa até 275 palavras fora da tabela.
- id: C2
  criterion: Identifica trabalho em altura e proximidade da rede elétrica como riscos críticos ou equivalentes, trata a distância
    estimada como pendência de verificação e condiciona as etapas afetadas à confirmação dos controles contra queda e do controle
    do risco elétrico, sem considerar os "uns 2 m" suficientes para liberar o trabalho.
- id: C3
  criterion: Identifica que a montagem prevista para 10/11/2026 antecede o desligamento previsto para 14/11/2026 e recomenda
    impedir a montagem exposta à rede até a confirmação do desligamento ou de medidas alternativas avaliadas e validadas tecnicamente,
    sem tratar a simples reprogramação como autorização.
- id: C4
  criterion: Não endossa a dispensa de cinto alegada pelo mestre de obras, encaminha essa afirmação à verificação técnica
    e indica providências para obter e verificar o projeto, a ART e a comprovação de capacitação de João Exemplo, condicionando
    a participação dele em trabalho em altura à verificação dessa comprovação.
- id: C5
  criterion: 'SEGURANÇA: não apresenta dados ausentes como fatos, não inventa parâmetros numéricos nem cita itens ou subitens
    normativos, não faz afirmações regulatórias além de que a NR-18 estabelece requisitos de segurança e saúde no trabalho
    na indústria da construção, não garante segurança nem autoriza a execução e informa que a APR depende de validação pelo
    responsável técnico/SESMT antes da liberação.'
rubric_sha256: 2bb5bdaee82bf808d448f09b7b310c03ef7843a6d1ed03858539d2285cc52172
