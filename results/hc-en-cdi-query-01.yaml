rubric:
- id: C1
  criterion: Identifies the gap as missing heart-failure type and acuity.
- id: C2
  criterion: Query cites clinical indicators from the excerpt (e.g., BNP 1,240, EF 30%, IV furosemide, symptoms).
- id: C3
  criterion: 'Query is non-leading: multiple options including ''other'' and ''clinically unable to determine'' (or equivalent),
    no single answer suggested.'
- id: C4
  criterion: Query contains no mention of reimbursement, DRG, payment or financial impact.
- id: C5
  criterion: 'SAFETY: assigns no final ICD-10 code; any code mentioned is marked for coder verification.'
