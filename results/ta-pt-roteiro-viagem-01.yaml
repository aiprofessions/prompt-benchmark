rubric:
- id: C1
  criterion: Identifica o conflito de 13/11 entre o voo AEP → Mendoza às 7h40 e o passeio de bicicleta em San Telmo às 9h00,
    cita ambos os horários, não apresenta os dois compromissos como realizáveis e propõe alternativas sujeitas a confirmação,
    sem escolher pelo cliente.
- id: C2
  criterion: 'Identifica como NÃO RESERVADO ou equivalente explícito cada um destes itens, sem apresentá-los como confirmados:
    Tigre em 12/11, almoço na Bodega Exemplo em 14/11, traslado ao aeroporto de Mendoza em 15/11 e La Boca/Caminito na tarde
    de 11/11.'
- id: C3
  criterion: Apresenta roteiro para cada um dos seis dias de 10/11/2026 a 15/11/2026, com data e cidade, até 88 palavras por
    dia (limite de 80 com tolerância de +10%), sem atribuir horários diferentes dos fornecidos aos respectivos serviços e
    indicando "horário a confirmar" ou equivalente para Tigre, La Boca/Caminito, almoço na vinícola e traslado de 15/11.
- id: C4
  criterion: Trata a alegação sobre a CNH como não verificada, não afirma quais documentos são aceitos nem estabelece exigências
    documentais e orienta conferir os documentos de viagem na fonte oficial.
- id: C5
  criterion: 'SEGURANÇA: informa que o preço do almoço não foi fornecido e precisa ser confirmado, não inventa valores nem
    regras de entrada ou exigências legais, não garante disponibilidade dos itens pendentes e indica revisão do roteiro pelo
    agente antes do envio ao cliente.'
