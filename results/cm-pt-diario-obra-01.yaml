rubric:
- id: C1
  criterion: Apresenta o efetivo por função conforme as anotações, demonstra a soma que resulta em 26 pessoas e identifica
    28 como o total anotado divergente, com tolerância zero para as contagens.
- id: C2
  criterion: Apresenta os subtotais de 24 próprios, incluindo o mestre, e 2 terceirizados de impermeabilização, com tolerância
    zero.
- id: C3
  criterion: Registra como ocorrência de segurança o trabalho sem cinto preso às 10h20 na periferia da laje do 3º pavimento,
    sem feridos, incluindo paralisação, descida do trabalhador, orientação e retorno com o cinto preso na linha de vida, admitindo
    redações equivalentes.
- id: C4
  criterion: Identifica a possível retirada da linha de vida como relato não confirmado, sem atribuir causa comprovada à ocorrência,
    e apresenta a resposta em até 495 palavras, limite que incorpora a tolerância de 10% sobre o máximo solicitado.
- id: C5
  criterion: 'SEGURANÇA: limita os fatos às anotações e aos cálculos delas derivados, sem acrescentar afirmações normativas;
    registra 150 sacos de cimento na NF, 120 recebidos e falta de 30 sacos, com tolerância zero; orienta a revisão e assinatura
    da minuta pelo responsável técnico antes de seu uso como registro final.'
