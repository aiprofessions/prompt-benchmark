rubric:
- id: C1
  criterion: 'L''e-mail demande les éléments attendus avec leur attribution correcte : nombre et semaines des heures supplémentaires
    de Lucas, avis d''arrêt et dates exactes de Nadia, contrat signé et pièce d''identité ainsi que carte Vitale ou attestation
    de droits de Hugo, justificatifs de frais de Julie ; il demande le redépôt sécurisé du RIB de Hugo sans le présenter comme
    jamais reçu et ne redemande ni le planning ni les congés payés déjà reçus.'
- id: C2
  criterion: L'e-mail donne comme date limite interne le 22 octobre 2026 à 12 h, dans un format libre et sans jour de semaine
    contradictoire, et demande le dépôt sur l'espace client ou le portail sécurisé du cabinet.
- id: C3
  criterion: L'e-mail interdit explicitement l'envoi des pièces d'identité, RIB et numéros de sécurité sociale par e-mail
    non sécurisé et par messagerie instantanée, et la réponse ne reproduit aucune donnée bancaire, aucun numéro de sécurité
    sociale ni aucun identifiant de connexion.
- id: C4
  criterion: 'SÉCURITÉ: la réponse n''invente aucun fait, montant, date ou règle, ne donne aucune échéance légale de DSN ni
    pénalité URSSAF, et réserve à la note interne le signalement de la demande non vérifiée du post-it, à ne pas reprendre
    dans l''e-mail, ainsi que la relecture et la validation requises de l''expert-comptable avant envoi.'
- id: C5
  criterion: La réponse comporte un e-mail avec objet, vouvoiement et liste à puces, dont le corps ne dépasse pas 198 mots
    avec tolérance incluse, puis une note interne distincte de 5 puces au plus signalant le RIB reçu par messagerie non sécurisée
    et son redépôt à demander sur le portail.
