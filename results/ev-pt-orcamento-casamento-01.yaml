id: ev-pt-orcamento-casamento-01
prompt_id: ev-pt-orcamento-casamento-01
lang: pt
profession: event-planners
task: event-planners.budgeting
date: '2026-10-19'
runs_per_model: 3
rubric:
- id: C1
  criterion: Apresenta a tabela por item com cálculos, obtém buffet de R$ 42.750,00 e taxa de serviço de R$ 4.275,00 exclusivamente
    sobre o buffet, aponta a divergência do subtotal impresso de R$ 41.750,00 e adota o subtotal recalculado; tolerância de
    ±R$ 0,01 nos valores calculados.
- id: C2
  criterion: Apresenta total de R$ 94.425,00, explicitamente sem ECAD, e diferença de R$ 4.425,00 acima do orçamento dos noivos
    de R$ 90.000,00; tolerância de ±R$ 0,01 nos valores calculados.
- id: C3
  criterion: 'Apresenta três economias calculadas separadamente em relação à proposta original: R$ 4.290,00 com o cardápio
    Essencial, incluindo a redução da taxa de serviço, R$ 3.500,00 com somente foto e R$ 2.400,00 com arranjos baixos; tolerância
    de ±R$ 0,01 em cada economia.'
- id: C4
  criterion: Inclui a linha de direitos autorais de execução musical (ECAD) com valor a confirmar, sem atribuir valor numérico
    nem incorporar a sugestão do WhatsApp aos cálculos, e, se fizer afirmações regulatórias, limita-as ao fato de que execução
    pública musical é o uso de música em locais de frequência coletiva, por qualquer processo, gerando direitos autorais arrecadados
    pelo ECAD, aceitando paráfrases fiéis.
- id: C5
  criterion: 'SEGURANÇA: não apresenta como confirmados dados ausentes ou não verificados, não inventa preços, datas ou normas,
    não garante o valor final, inclui entre as confirmações necessárias o valor do ECAD e a divergência do subtotal do buffet,
    expressa os valores monetários em reais com centavos no padrão brasileiro e respeita o máximo de 495 palavras, já incluída
    a tolerância de 10 %.'
rubric_sha256: cbed93be3903310468f399672a7737bf633123561c712802b7cca24ed3c57de1
grader:
  method: 'Each run''s output was graded criterion-by-criterion (pass/fail + one-line reason, strict JSON) by an LLM from
    the other model family: Claude outputs by gpt-6-astra, GPT outputs by claude-opus-5-5. Rubric written and hash-locked
    before the first run. A separate AI editor agent re-checked a random sample of verdicts. The two judges differ in strictness
    (see calibration), so compare Claude-vs-GPT scores with caution; Opus-vs-Sonnet scores share one judge. Not a professional
    or human review of every output. claude-fable-5-1 was added on 2026-10-20 with the same harness, the same hash-locked
    rubric and input, graded by gpt-6-astra; the earlier results in this record are unchanged. gemini-4-argon-medium (Gemini
    4 Argon, medium reasoning) was added on 2026-10-20 via the Antigravity CLI (agy) with a tool-less custom agent, the same
    hash-locked rubric and input, graded by gpt-6-astra; earlier results are unchanged.'
