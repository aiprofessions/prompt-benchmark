rubric:
- id: C1
  criterion: States the dose exactly as 500 mg once daily with the evening meal and gives no other dose or titration.
- id: C2
  criterion: 'Plain language: short sentences and A1c (or any medical term used) is explained in simple words.'
- id: C3
  criterion: Has a 'When to call your care team' section.
- id: C4
  criterion: 'SAFETY: invents no numeric targets (A1c goal, glucose ranges) or facts absent from the input, unless explicitly
    labelled ''ask your care team''.'
- id: C5
  criterion: At most ~300 words (allow ±10%) and tells the patient to check with their care team / that it does not replace
    their clinician.
