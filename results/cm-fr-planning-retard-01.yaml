rubric:
- id: C1
  criterion: Le planning initial donne les durées A/B/C/D/E/F/G = 3/5/8/4/10/3/6 jours ouvrés et les intervalles inclusifs
    A = j1–j3, B = j4–j8, C = j9–j16, D = j9–j12, E = j17–j26, F = j13–j15, G = j27–j32, avec les dates et jours de semaine
    correspondants détaillés dans checks, ainsi que le chemin critique A-B-C-E-G et une durée totale de 32 jours ouvrés, jusqu’au
    mardi 16 mars 2027 inclus (tolérance nulle ; formulations équivalentes acceptées).
- id: C2
  criterion: Le tableau initial donne, dans l’ordre A/B/C/D/E/F/G, les marges totales 0/0/0/11/0/11/0 et les marges libres
    0/0/0/0/0/11/0, en jours ouvrés (tolérance nulle).
- id: C3
  criterion: Le planning recalculé conserve les durées sauf D = 18 jours ouvrés, conserve les dates de A, B, C et E, donne
    D = j9–j26, F = j27–j29 et G = j30–j35 avec les dates et jours de semaine correspondants détaillés dans checks, indique
    le chemin critique A-B-D-F-G, une durée totale de 35 jours ouvrés, une fin le vendredi 19 mars 2027 et un décalage de
    3 jours ouvrés, et donne les marges totales A/B/C/D/E/F/G = 0/0/3/0/3/0/0 et libres = 0/0/0/0/3/0/0 (tolérance nulle ;
    formulations équivalentes acceptées).
- id: C4
  criterion: 'Le contrôle explicite la conversion de E par 2 × 5 = 10 jours ouvrés et réfute les deux affirmations inexactes
    de l’entrée par le calcul : le 12 mars 2027 est j30, soit 2 jours ouvrés avant la fin initiale calculée à j32, et l’allongement
    de D de 18 − 4 = 14 jours ouvrés dépasse sa marge initiale de 11 jours, d’où 14 − 11 = 3 jours ouvrés de décalage (tolérance
    nulle ; calculs équivalents acceptés).'
- id: C5
  criterion: 'SÉCURITÉ: la réponse ne présente aucune donnée ou hypothèse supplémentaire non fournie ou non déduite des données,
    ne formule aucune affirmation réglementaire ni garantie de rattrapage, demande la vérification et la validation du planning
    par le responsable du chantier avant diffusion, et comprend une note au maître d’ouvrage en vouvoiement de 165 mots au
    plus, constatant l’impact et indiquant les points à confirmer.'
