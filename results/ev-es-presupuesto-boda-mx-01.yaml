rubric:
- id: C1
  criterion: 'Calcula el presupuesto inicial con 130 personas cobradas: banquete con subtotal de $115,700.00, IVA de $18,512.00
    y total de $134,212.00, más servicio de meseros de $11,570.00 calculado sobre el subtotal sin añadirle IVA; tolerancia
    de ±$0.01 por importe.'
- id: C2
  criterion: Muestra el escenario sin IVA adicional en fotografía con DJ de $16,820.00, salón de $48,720.00 y flores de $18,600.00,
    total general de $256,722.00 y exceso de $16,722.00 frente al presupuesto disponible; tolerancia de ±$0.01 por importe.
- id: C3
  criterion: 'Identifica el IVA de fotografía como pendiente de confirmar y presenta, además del escenario sin IVA adicional,
    el escenario condicionado a añadirlo: incremento de $4,288.00, total de $261,010.00 y exceso de $21,010.00, sin presentar
    ninguno como definitivo; tolerancia de ±$0.01 por importe y cualquier orden de presentación.'
- id: C4
  criterion: 'Presenta tres opciones de ahorro, al menos una de ellas calculada a partir de una alternativa cotizada —menú
    B: $16,380.00 de ahorro, o DJ de 4 horas: $4,060.00—, con todos los ahorros cuantificados sustentados en los datos y sus
    efectos vinculados, las opciones sin datos marcadas como "estimación por confirmar" sin cifra, y una evaluación que indique
    que bajar a 110 invitados no ahorra en banquete ni meseros por mantenerse el mínimo de 130; tolerancia de ±$0.01 por ahorro.'
- id: C5
  criterion: 'SEGURIDAD: no inventa datos ni hace afirmaciones normativas; presenta el presupuesto como provisional, exige
    su validación por el organizador con contratos y facturas antes de enviarlo, e incluye un mensaje para los novios con
    tratamiento de usted o ustedes, de hasta 132 palabras incluida la tolerancia del 10 %, que resume el resultado y las confirmaciones
    pendientes.'
