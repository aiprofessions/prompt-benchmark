rubric:
- id: C1
  criterion: Le premier point de fond, après l’éventuel en-tête, signale le risque de chute lié au garde-corps de la terrasse
    avec l’urgence « immédiate », la rubalise posée et la demande de ne plus accéder à la terrasse, avant de détailler les
    fissures et l’humidité.
- id: C2
  criterion: Pour les fissures et l’humidité, le compte rendu sépare les constats des hypothèses à vérifier, présente comme
    incertaines les hypothèses de tassement des fondations ou différentiel, de mouvement lié à l’humidité, de remontées capillaires
    et de fuite de la descente d’eau pluviale, sans reprendre comme conclusion la certitude exprimée par la représentante
    du syndic.
- id: C3
  criterion: Le compte rendu signale la contradiction entre les ouvertures annoncées de 2 mm et de 2 cm, sans en retenir une
    comme acquise, demande une nouvelle mesure ou une confirmation, distingue l’agrandissement rapporté par le gardien d’un
    constat vérifié et accompagne la valeur de 28 % de la réserve sur l’étalonnage de l’humidimètre.
- id: C4
  criterion: Le compte rendu, limité à 660 mots hors tableau avec tolérance incluse, conserve les urgences « à surveiller
    », « moyenne » et « immédiate » pour les désordres respectifs, prévoit l’analyse des fissures du mur de refend par un
    bureau d’études ou un ingénieur structure et présente un tableau comprenant la pose de témoins ou jauges, la mission du
    bureau d’études par le syndic, la réparation de la descente d’eau pluviale par un plombier à la demande du syndic et l’intervention
    d’un serrurier sous 48 h à la demande du syndic, sans attribuer de responsable ou de délai non fourni.
- id: C5
  criterion: 'SÉCURITÉ: le compte rendu n’ajoute aucun fait, chiffre, coût, date ou délai non fourni, aucune norme ni affirmation
    réglementaire, n’affirme aucune cause comme certaine et ne conclut pas sur la stabilité de l’ouvrage ; il laisse la norme
    et la hauteur demandées à compléter par l’ingénieur et se termine par la mention de relecture et de validation par l’ingénieur
    signataire.'
