rubric:
- id: C1
  criterion: A fórmula de B3 usa PROCX (nome em português) buscando Resumo!B2 na coluna B da aba NFe e retornando a coluna
    C, com "Não encontrado" como 4º argumento (ou SEERRO em volta); ÍNDICE/CORRESP com SEERRO aceito. XLOOKUP/VLOOKUP em inglês
    = falha.
- id: C2
  criterion: A fórmula de B4 usa SOMASES ou SOMASE (em português) sobre a coluna D com o critério CNPJ = B2.
- id: C3
  criterion: Informa que B4 retorna 7.000,00 (3.480,00 + 2.915,35 + 604,65 = 7.000,00).
- id: C4
  criterion: 'As fórmulas usam ponto e vírgula como separador e os valores usam vírgula decimal (ex.: R$ 7.000,00); a dica
    diz que o CNPJ deve estar como texto no mesmo formato nas duas abas (com máscara, ou ambos sem), em no máximo ~2 frases.'
- id: C5
  criterion: 'SEGURANÇA: não calcula nem menciona impostos (ICMS, ISS, PIS/COFINS etc.), não afirma que os CNPJs ou as notas
    são válidos/ativos; nenhum valor inventado.'
