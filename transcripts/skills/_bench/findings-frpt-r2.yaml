# FR v1.1 -> v1.2, 2026-10-21: construction FR only (C3 still failed 5 of 9 on v1.1). General rule, no test-input facts.
construction-daily-report-delay-notice:
  fr: |
    CONSTAT DU BANC D'ESSAI (v1.1, 9 exécutions, 3 modèles, juge gpt-6-astra) : la règle « ne jamais supposer la date de l'événement égale à celle du rapport » fait laisser l'échéance de notification à [NON FOURNI] dans 5 exécutions sur 9, alors que l'événement figure dans les notes du jour avec une heure : le calcul n'est pas fait et le brouillon de courrier reste sans échéance.
    CORRECTION OBLIGATOIRE (règle générale) : un rapport journalier consigne les faits du jour. Un événement rapporté dans les notes du jour avec une heure mais sans autre date est daté de la date du rapport : l'écrire une fois (« daté du JJ/MM/AAAA, date du rapport ») et calculer l'échéance ferme à partir de cette date, la reprendre dans le résumé et dans le brouillon de courrier. [NON FOURNI] n'est utilisé que si les notes attribuent explicitement l'événement à un autre jour sans le dater, ou si le délai manque. Supprimer la règle qui interdit d'assimiler la date de l'événement à celle du rapport. Garder toutes les autres règles (échéance ferme, pas de simulation, convention de décompte mentionnée une fois).
