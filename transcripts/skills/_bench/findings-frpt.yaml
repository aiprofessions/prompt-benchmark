# FR/PT revision findings (v1.0 -> v1.1), 2026-10-21. Only the listed skill × lang pairs are revised
# (REVISE_FINDINGS=findings-frpt.yaml python3 revise.py <ids>). Every fix is a GENERAL behaviour rule (no test-input
# facts), so re-testing on the same locked input (rubrics.lock-frpt.json, never re-locked) is not teaching to the key.
event-planners-vendor-rfp:
  fr: |
    CONSTAT DU BANC D'ESSAI (v1.0, 9 exécutions, 3 modèles, juge gpt-6-astra) : 9 sur 9 échouent sur le même point. (a) Le format de devis ne demande pas de ligne distincte pour l'installation / la mise en place (seulement livraison et enlèvement) ; (b) quand le brief ne donne pas de critères de choix, la consultation les laisse « [NON FOURNI] » ou en simple « Hypothèse », si bien que le prestataire ne sait pas sur quoi il sera évalué.
    CORRECTION OBLIGATOIRE (règles générales) : (a) le cadre de devis impose toujours des lignes séparées pour : chaque prestation (repas/boissons/équipement), le personnel, la livraison, l'installation / mise en place, le démontage / l'enlèvement, les frais de service, puis montants HT, TVA (taux et montant) et TTC ; le prestataire indique « sans objet » le cas échéant. (b) Si le brief ne fournit pas de critères de choix, la consultation PROPOSE toujours une courte liste de critères concrets, sous l'intitulé « Critères de choix proposés — à valider avec le client avant envoi » (par exemple : conformité aux besoins exprimés, clarté et exhaustivité du devis détaillé, références sur des événements comparables, organisation proposée face aux contraintes du lieu, procédure allergènes / sécurité si pertinent, assurance et conditions) ; ces critères figurent dans la rubrique calendrier/critères avec les dates de réponse et de décision, et leur validation est rappelée dans « Points à confirmer ». Ne jamais remplacer les critères par [NON FOURNI]. Garder toutes les autres règles (passage unique, aucun budget/prix/nom/capacité inventé).
  pt: |
    ACHADO DO BANCO DE TESTES (v1.0, 9 execuções, 3 modelos, juiz gpt-6-astra): 9 de 9 falham no mesmo ponto — quando o briefing não traz critérios de avaliação, o pedido de proposta deixa os critérios como [NÃO INFORMADO], porque o passo 8 proíbe criar critérios; o fornecedor fica sem saber como será avaliado.
    CORREÇÃO OBRIGATÓRIA (regra geral): se o briefing não trouxer critérios de avaliação, o pedido SEMPRE propõe uma lista curta de critérios concretos, sob o título «Critérios de avaliação propostos — confirmar com o cliente antes do envio» (por exemplo: atendimento aos requisitos técnicos informados, clareza e completude do preço discriminado, experiência/referências em eventos comparáveis, plano operacional para as restrições do local, seguro e condições comerciais); os critérios ficam na seção de prazos/critérios junto com as datas de resposta e de decisão, e a confirmação deles é lembrada na última seção. Nunca substitua os critérios por [NÃO INFORMADO]. Continue proibido inventar pesos numéricos, datas, orçamento, preços, nomes, contatos ou capacidades do local. Mantenha todas as outras regras (passada única, preço discriminado, seguro, sinal/cancelamento).
construction-daily-report-delay-notice:
  fr: |
    CONSTAT DU BANC D'ESSAI (v1.0, 9 exécutions, 3 modèles, juge gpt-6-astra) : quand les notes donnent un délai contractuel de notification en jours calendaires et la date de l'événement, la skill fait présenter l'échéance comme une « simulation », « provisoire » ou « non contractuelle », et le brouillon de courrier laisse l'échéance indéterminée (6 échecs sur 9). Autres écarts ponctuels : un total des effectifs présenté comme « sous-total » alors que chaque corps d'état était chiffré ; une date initiale de coulage affirmée sans être fournie.
    CORRECTION OBLIGATOIRE (règles générales) : (a) si les notes donnent la date de l'événement et un délai en jours calendaires, calculer et ÉNONCER l'échéance de notification comme une date ferme : « Échéance de notification : JJ/MM/AAAA (JJ/MM/AAAA + N jours calendaires) », la reprendre telle quelle dans le brouillon de courrier et dans le résumé ; ne jamais la qualifier de simulation, d'hypothèse, de provisoire ou de non contractuelle. La convention de décompte retenue (jour de l'événement exclu) est mentionnée UNE fois, entre parenthèses, et le service marchés la confirme dans « Points à confirmer » — sans affaiblir l'échéance affichée. Ne pas proposer d'échéance alternative. (b) Quand chaque corps d'état a un effectif chiffré, afficher l'addition et « Total : N » ; n'utiliser « sous-total » que si un effectif n'est pas chiffré. (c) Ne jamais affirmer une date initialement prévue, une durée de retard ou un impact qui ne figurent pas dans les notes. Garder toutes les autres règles.
sales-managers-pipeline-review:
  fr: |
    CONSTAT DU BANC D'ESSAI (v1.0, 9 exécutions, 3 modèles, juge gpt-6-astra) : une affaire dont le seul interlocuteur est un contact unique (une seule personne citée) n'est pas signalée comme risque — la règle n'existe pas dans la skill (4 échecs sur 9) ; quand elle est mentionnée, aucune question de coaching ne lui est associée. Par ailleurs le seuil d'inactivité de 21 jours est présenté dans la sortie comme un fait, et le juge le considère comme non fondé.
    CORRECTION OBLIGATOIRE (règles générales) : (a) ajouter la règle R5 — Mono-contact : une seule personne ou un seul interlocuteur est mentionné pour l'affaire (champ contact ou notes) ; toujours la signaler comme alerte, même si l'affaire est par ailleurs saine, et lui associer une question de coaching (élargir les interlocuteurs / identifier le décideur) ; (b) chaque affaire signalée, pour quelque règle que ce soit, reçoit exactement une question de coaching, y compris R5 ; (c) le seuil d'inactivité de 21 jours est un seuil par défaut de la revue : l'écrire une fois dans la sortie comme « Hypothèse : seuil d'inactivité par défaut de 21 jours, à ajuster par l'équipe » et rappeler cette hypothèse dans la dernière section. Garder toutes les autres règles (calculs, exclusions, R1–R4).
