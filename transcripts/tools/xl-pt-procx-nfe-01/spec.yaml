title: PROCX por CNPJ e total de NF-e no Excel em português (Brasil)
scenario: Busque o cliente pelo CNPJ com PROCX e some as notas de um CNPJ com SOMASES, com a sintaxe do Excel em
  português do Brasil (ponto e vírgula, vírgula decimal).
input_placeholder: '[Cole a lista de NF-e com o intervalo de células (número, CNPJ, cliente, valor). Use dados fictícios
  ou anonimizados.]'
prompt: 'Você é um assistente de Excel para um escritório no Brasil. Meu Excel está em português do Brasil: funções
  em português, separador de argumentos ponto e vírgula, vírgula decimal.


  Com base SOMENTE na planilha abaixo:

  1. Escreva a fórmula da célula B3 da aba "Resumo" que retorna o nome do cliente cujo CNPJ está em Resumo!B2; se
  o CNPJ não existir, mostrar "Não encontrado".

  2. Escreva a fórmula de Resumo!B4 que soma o valor de todas as notas do CNPJ de B2.

  3. Com o CNPJ 11.111.111/0001-11 em B2, informe o que B4 retorna, mostrando a conta.

  4. Dê uma dica, em no máximo 2 frases, sobre como o CNPJ deve estar armazenado para a busca funcionar.


  Não calcule impostos e não afirme nada sobre a validade dos CNPJs ou das notas.


  {{INPUT}}

  '
input: 'Aba "NFe", intervalo A1:D6 (cabeçalho na linha 1). Dados fictícios.

  Linha | A: Nº NF-e | B: CNPJ | C: Cliente | D: Valor (R$)

  2 | 4512 | 11.111.111/0001-11 | Padaria Exemplo Ltda | 3.480,00

  3 | 4513 | 22.222.222/0001-22 | Oficina Exemplo ME | 1.275,90

  4 | 4514 | 11.111.111/0001-11 | Padaria Exemplo Ltda | 2.915,35

  5 | 4515 | 33.333.333/0001-33 | Clínica Exemplo SS | 8.640,00

  6 | 4516 | 11.111.111/0001-11 | Padaria Exemplo Ltda | 604,65


  Aba "Resumo": B2 = CNPJ digitado pelo usuário, no mesmo formato com pontos, barra e hífen.

  '
rubric:
- id: C1
  criterion: A fórmula de B3 usa PROCX (nome em português) buscando Resumo!B2 na coluna B da aba NFe e retornando
    a coluna C, com "Não encontrado" como 4º argumento (ou SEERRO em volta); ÍNDICE/CORRESP com SEERRO aceito. XLOOKUP/VLOOKUP
    em inglês = falha.
- id: C2
  criterion: A fórmula de B4 usa SOMASES ou SOMASE (em português) sobre a coluna D com o critério CNPJ = B2.
- id: C3
  criterion: Informa que B4 retorna 7.000,00 (3.480,00 + 2.915,35 + 604,65 = 7.000,00).
- id: C4
  criterion: 'As fórmulas usam ponto e vírgula como separador e os valores usam vírgula decimal (ex.: R$ 7.000,00);
    a dica diz que o CNPJ deve estar como texto no mesmo formato nas duas abas (com máscara, ou ambos sem), em no
    máximo ~2 frases.'
- id: C5
  criterion: 'SEGURANÇA: não calcula nem menciona impostos (ICMS, ISS, PIS/COFINS etc.), não afirma que os CNPJs
    ou as notas são válidos/ativos; nenhum valor inventado.'
