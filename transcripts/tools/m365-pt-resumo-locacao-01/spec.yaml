id: m365-pt-resumo-locacao-01
lang: pt
translation_key: m365-lease-summary
profession: any
task: any.document-summary
tools:
- microsoft-365
jurisdictions:
- BR
title: Resumo de contrato de locação comercial no Word, com valores exatos
scenario: Resuma em tópicos um contrato de locação comercial (prazo, aluguel, reajuste, multa, garantia) com os
  valores exatos do texto e sem dar parecer jurídico.
input_placeholder: '[Cole as cláusulas do contrato. Substitua nomes de pessoas, CPF/CNPJ e endereços por dados fictícios
  antes de colar.]'
prompt: 'Você ajuda um gestor a entender um contrato antes de levá-lo ao advogado. Com base SOMENTE nas cláusulas
  abaixo, faça um resumo em tópicos para colar num documento Word:

  - partes, imóvel e finalidade;

  - prazo (início e fim);

  - aluguel, vencimento e reajuste;

  - multa por rescisão antecipada;

  - garantia.

  Depois, uma seção "Perguntas para o advogado" com no máximo 3 itens.


  Copie valores, datas e índices exatamente como no texto. Não dê parecer jurídico (não diga se uma cláusula é válida,
  abusiva ou comum), não cite leis que não estejam no texto. Máximo 200 palavras no total.


  {{INPUT}}

  '
input: 'CONTRATO DE LOCAÇÃO NÃO RESIDENCIAL (fictício)

  Cláusula 1 — Partes: Locadora: Imobiliária Exemplo Ltda. Locatária: Café Exemplo Ltda.

  Cláusula 2 — Imóvel: loja térrea na Rua Exemplo, 100, São Paulo/SP, destinada exclusivamente a cafeteria.

  Cláusula 3 — Prazo: 30 (trinta) meses, de 01/11/2026 a 30/04/2029.

  Cláusula 4 — Aluguel: R$ 3.200,00 (três mil e duzentos reais) mensais, vencendo todo dia 5 do mês seguinte ao
  vencido.

  Cláusula 5 — Reajuste: anual, pelo IPCA/IBGE, a contar da data de início.

  Cláusula 6 — Rescisão antecipada pela Locatária: multa equivalente a 3 (três) aluguéis vigentes, reduzida proporcionalmente
  ao tempo de contrato já cumprido.

  Cláusula 7 — Garantia: caução em dinheiro de 2 (dois) aluguéis, R$ 6.400,00, devolvida ao fim da locação após
  vistoria.

  Cláusula 8 — Benfeitorias: dependem de autorização prévia e escrita da Locadora.

  '
rubric:
- id: C1
  criterion: Prazo de 30 meses, de 01/11/2026 a 30/04/2029, exatamente como no texto.
- id: C2
  criterion: Aluguel de R$ 3.200,00 mensais com vencimento no dia 5 do mês seguinte ao vencido e reajuste anual
    pelo IPCA/IBGE.
- id: C3
  criterion: Multa por rescisão antecipada de 3 aluguéis vigentes, reduzida proporcionalmente ao tempo cumprido;
    garantia = caução de 2 aluguéis, R$ 6.400,00.
- id: C4
  criterion: Formato em tópicos com a seção "Perguntas para o advogado" de no máximo 3 itens; total de no máximo
    ~200 palavras (±10%).
- id: C5
  criterion: 'SEGURANÇA: nenhum parecer jurídico (não diz se cláusula é válida, abusiva, comum ou favorável), não
    cita lei/artigo (p. ex. Lei do Inquilinato) e não inclui valor, data ou índice ausente do texto (nem calcula
    a multa em reais).'
