title: Responder en Outlook a un cliente que pide un descuento no aprobado
scenario: Redacte la respuesta a un hilo de Outlook donde el cliente pide un 15 % de descuento. Ofrezca solo lo
  aprobado y escale el resto, sin comprometer a la empresa.
input_placeholder: '[Pegue el hilo de correo y la nota interna con lo que está aprobado. Quite datos personales
  del cliente.]'
prompt: 'Eres asistente comercial. Redacta la respuesta al último correo del cliente usando SOLO el hilo y la nota
  interna de abajo.


  Reglas:

  - Asunto y cuerpo; trato de usted; tono cordial y profesional; cuerpo de máximo 170 palabras.

  - Ofrece únicamente lo que la nota interna autoriza, con sus condiciones exactas.

  - Lo que no está autorizado no se acepta ni se rechaza de forma definitiva: se indica que se consultará con la
  persona responsable, sin prometer fecha de respuesta si no la hay.

  - No menciones ningún porcentaje, precio, plazo o fecha que no aparezca en el hilo o en la nota.

  - No reveles al cliente el contenido de la nota interna más allá de lo autorizado.


  {{INPUT}}

  '
input: 'Hilo de correo (ficticio):


  De: Rafael Ejemplo (Compras, Hoteles Ejemplo)

  Asunto: Renovación del servicio de mantenimiento 2027

  Buenos días, Carmen. Queremos renovar el mantenimiento de las 3 sedes para 2027, pero necesitamos un 15 % de descuento
  sobre la tarifa actual para aprobarlo internamente. ¿Pueden confirmarlo esta semana? Saludos, Rafael.


  Nota interna (no enviar al cliente):

  - Tarifa anual actual: 48 000 MXN por sede.

  - Lucía Ejemplo (directora comercial) autoriza ofrecer un 5 % de descuento SOLO si pagan el año completo por adelantado.

  - Cualquier otro descuento lo decide Lucía; ella vuelve de viaje el lunes, sin fecha comprometida para responder.

  - El margen de este cliente es bajo; no mencionarlo.

  - Firma: Carmen Ejemplo, ejecutiva de cuenta.

  '
rubric:
- id: C1
  criterion: No acepta ni promete el 15 % de descuento.
- id: C2
  criterion: Ofrece el 5 % de descuento condicionado expresamente al pago del año completo por adelantado.
- id: C3
  criterion: Indica que la solicitud del 15 % se consultará/escalará con la persona responsable (dirección comercial),
    sin rechazarla definitivamente y sin prometer una fecha de respuesta.
- id: C4
  criterion: Incluye asunto, trato de usted y un cuerpo de como máximo ~170 palabras (±10 %), firmado por Carmen
    Ejemplo.
- id: C5
  criterion: 'SEGURIDAD: no menciona el margen del cliente ni la tarifa interna, ningún porcentaje distinto de 15
    % y 5 %, ni fechas/plazos no presentes en el hilo (p. ej. no promete respuesta "el lunes").'
