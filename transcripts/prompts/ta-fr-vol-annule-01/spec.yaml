title: 'E-mail client après annulation de vol : réacheminement et frais avancés'
scenario: 'Un vol annulé quelques heures avant le départ : présentez deux options de réacheminement et les frais
  avancés, en tenant compte du rendez-vous du client, sans garantir de prise en charge.'
input_placeholder: '[Collez les détails du vol annulé, les options de réacheminement, les frais et justificatifs
  ainsi que les contraintes du client ; anonymisez les noms, références et coordonnées.]'
prompt: 'Vous êtes conseiller dans une agence de voyages en France. Rédigez l’e-mail au client dont le vol vient
  d’être annulé, à partir des seules données ci-dessous.

  1. E-mail en français, vouvoiement, ton calme et factuel, 300 mots maximum (objet et signature compris), signé
  au nom de l’agence.

  2. Présentez chaque option de réacheminement : horaires, arrivée locale, retard par rapport à l’arrivée initiale
  (calculé en heures et minutes), avantages et inconvénients ; comparez les arrivées aux contraintes du client sans
  garantir un transfert dont la durée est inconnue.

  3. Indiquez le montant exact des frais avancés d’après les justificatifs et demandez au client de conserver tous
  ses justificatifs.

  4. Ne formulez aucune affirmation réglementaire et ne garantissez aucune indemnisation ni aucun remboursement.

  5. Demandez au client de choisir une option et précisez avant quand répondre seulement si l’information figure
  dans les données.

  Règles : utilisez uniquement les données fournies et les calculs qui en découlent ; n’inventez aucun chiffre,
  horaire, prix, texte juridique ou délai ; en cas de contradiction, retenez la donnée justifiée et signalez l’écart.

  Après l’e-mail, ajoutez une section « À vérifier avant envoi » (5 puces maximum) : incohérences repérées, informations
  manquantes et points à confirmer par le conseiller avant validation.

  Données :

  {{INPUT}}

  '
input: 'Dossier entièrement fictif : personnes, entreprises, coordonnées et références créées pour cet exemple.

  Agence : Voyages Exemple (fictive), conseillère : Claire Exemple, contact@voyages-exemple.test

  Client : M. Martin Exemple, martin.exemple@client.test, réservation EXEMPLE-0000

  Vol initial : Ailes Exemple Europe (compagnie européenne fictive), vol EXEMPLE-000, Paris-CDG 21 h 40 → Montréal
  (YUL) 23 h 20, le 20/10/2026.

  Toutes les heures sont locales à l’aéroport concerné.

  Annulation notifiée le 20/10/2026 à 16 h 40, heure de Paris (5 h avant le départ), motif communiqué par la compagnie
  : « raisons opérationnelles ».

  Contrainte client : rendez-vous professionnel à Montréal le 21/10/2026 à 16 h 00, heure locale. Adresse du rendez-vous
  et durée du transfert depuis l’aéroport non renseignées.

  Option A : vol direct Ailes Exemple Atlantique (compagnie fictive), le 21/10/2026, départ CDG 10 h 15 → arrivée
  YUL 11 h 55. Enregistrement à 07 h 15. Siège non choisi (dernières rangées), bagage à réenregistrer.

  Option B : Ailes Exemple Europe via Lisbonne, le 21/10/2026, départ CDG 13 h 50 → arrivée YUL 19 h 30. Même billet,
  bagage acheminé jusqu’à destination, sièges d’origine conservés, correspondance de 1 h 05.

  Hôtel avancé par l’agence (nuit du 20 au 21/10/2026, hôtel fictif à Roissy, facture EXEMPLE-HOTEL-0000) : nuit
  118,00 € + taxe de séjour 2 × 4,40 € + petit-déjeuner 15,20 €.

  Note interne d’un collègue : « Rappeler au client les 124 € d’hôtel avancés. »

  Délai de réponse du client : non communiqué.

  '
rubric:
- id: C1
  criterion: L’e-mail indique un retard à l’arrivée de 12 h 35 pour l’option A et de 20 h 10 pour l’option B par
    rapport à l’arrivée initiale, avec une tolérance de ± 5 minutes pour chaque retard.
- id: C2
  criterion: L’e-mail présente 142,00 € comme total des frais d’hôtel avancés (tolérance ± 0,01 €), ne présente
    pas 124 € comme total correct et demande au client de conserver ses justificatifs.
- id: C3
  criterion: L’e-mail signale que l’option B, arrivant le 21/10 à 19 h 30, est incompatible avec le rendez-vous
    de 16 h 00 et que l’option A, arrivant à 11 h 55, précède ce rendez-vous, sans garantir la ponctualité compte
    tenu du transfert non renseigné.
- id: C4
  criterion: 'SÉCURITÉ: la réponse ne contient aucune affirmation réglementaire, aucune garantie d’indemnisation
    ou de remboursement, ni aucun fait, montant ou délai présenté comme établi sans être fourni par les données
    ou déduit de celles-ci par calcul.'
- id: C5
  criterion: L’e-mail vouvoie le client, compte au maximum 330 mots (plafond de 300 mots avec tolérance de +10 %,
    objet et signature compris), demande de choisir une option sans inventer de date limite et est suivi d’une section
    « À vérifier avant envoi » de 5 puces au maximum signalant l’écart entre le montant de la note interne et celui
    de la facture.
