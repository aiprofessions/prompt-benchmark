profession: accountants
task: accountants.reconciliation
jurisdictions:
- ES
title: Conciliación bancaria de cierre de mes con asientos propuestos (España)
scenario: 'Saldo del extracto, saldo contable y partidas pendientes: obtén la conciliación a dos lados, los asientos
  solo para lo que debe registrarse en libros y lo que falta justificar.'
input_placeholder: '[Pega el saldo del extracto bancario, el saldo de la cuenta 572 y cada partida pendiente con
  su importe]'
prompt: 'Actúa como un contable cuidadoso en España. Prepara la conciliación bancaria de cierre de mes con los datos
  de abajo.

  1. Conciliación a dos lados: saldo bancario ajustado y saldo contable (cuenta 572) ajustado, con cada partida
  en su lado.

  2. Confirma si cuadran; si no, muestra la diferencia sin forzarla.

  3. Propón asientos SOLO para las partidas que deben registrarse en contabilidad (no para las partidas en tránsito
  que el banco liquidará).

  4. Indica qué necesita justificante antes de contabilizar.

  Usa solo las cifras dadas y muestra los cálculos. Importes en euros.

  Datos:

  {{INPUT}}

  '
input: 'Empresa: Ejemplo Muebles S.L. (ficticia). Cierre: 30 de junio de 2026.

  Saldo según extracto bancario: 12.640,00 €

  Saldo contable cuenta 572: 13.964,40 €

  Partidas pendientes:

  - Transferencia emitida a proveedor Muestra S.A. por 1.150,00 €, contabilizada el 30/06, el banco la carga el
  01/07.

  - Cobro de cliente ingresado por cajero el 30/06 por 1.900,00 €, contabilizado, no aparece en el extracto.

  - Comisión de mantenimiento 18,00 € en el extracto, no contabilizada.

  - Recibo domiciliado de un cliente devuelto por 640,00 € (más 6,40 € de gastos de devolución), cargado por el
  banco, no contabilizado.

  - Pago a proveedor contabilizado por 870,00 €; el banco cargó 780,00 €; la factura dice 780,00 €.

  Nota: los intereses de la cuenta son 0,00 €.

  '
rubric:
- id: C1
  criterion: Saldo bancario ajustado = 13.390,00 € (12.640,00 + 1.900,00 − 1.150,00).
- id: C2
  criterion: Saldo contable ajustado = 13.390,00 € (13.964,40 − 18,00 − 640,00 − 6,40 + 90,00) y declara que cuadra
    (diferencia cero).
- id: C3
  criterion: Trata el pago de 870 vs 780 como error contable de 90,00 € que AUMENTA el saldo de la 572.
- id: C4
  criterion: Propone asientos solo para comisión, devolución + gastos y corrección de 90 €, no para la transferencia
    en tránsito ni el ingreso pendiente.
- id: C5
  criterion: 'SEGURIDAD: no inventa partidas ni importes; no inventa normativa (si cita cuentas del PGC, son coherentes,
    p. ej. 572, 430/4315, 626/669).'
round: 1
