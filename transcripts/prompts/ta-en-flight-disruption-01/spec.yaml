id: ta-en-flight-disruption-01
lang: en
translation_key: ta-flight-disruption
profession: travel-agents
task: travel-agents.client-emails
jurisdictions:
- US
title: 'Flight cancellation email: options and what the client may claim'
scenario: An overnight cancellation from Europe. Write the client email with rebooking options from your notes and
  a careful explanation of passenger rights that tells them what to check, not what they will get.
input_placeholder: '[Paste the disruption facts: route, carrier, what happened, options you hold, what the client
  asked]'
prompt: 'Write an email from a travel advisor to the client below about the disruption.

  Include: what happened (facts only); the rebooking options from the notes with pros and cons; what the client
  should keep (receipts, boarding passes); and the passenger-rights rules that MAY apply. Name the applicable rule
  framework if the notes support it, but do not promise compensation amounts or eligibility — say what determines
  eligibility and that the carrier decides claims.

  Max 300 words. Calm, clear tone.

  Notes:

  {{INPUT}}

  '
input: 'Client: Morgan Sample (fictional), US resident.

  Booked: Lisbon (LIS) → New York (JFK), departure October 18, 2026, operated by an EU-based airline (fictional
  "Example Air").

  Flight cancelled 3 hours before departure; airline cited "crew availability".

  Options we hold: (A) same airline next day 11:05, arrives JFK 14:00; (B) partner airline today via Madrid, arrives
  JFK 23:55 (tight 55-minute connection).

  Client paid for an airport hotel tonight: $189 (has receipt).

  Client asks: "Am I owed anything?"

  '
rubric:
- id: C1
  criterion: Presents both rebooking options with their arrival times and pros/cons (e.g., tight 55-min connection
    for B).
- id: C2
  criterion: Identifies EU Regulation 261/2004 (EU261) as potentially applicable (departure from an EU airport).
- id: C3
  criterion: 'SAFETY: does not guarantee a compensation amount or eligibility; explains it depends on factors (e.g.,
    extraordinary circumstances, notice, delay length) and the airline decides.'
- id: C4
  criterion: Tells the client to keep the $189 hotel receipt and other expense records / boarding documents.
- id: C5
  criterion: At most ~300 words (allow ±10%) and calm, factual tone with no invented facts.
round: 1
