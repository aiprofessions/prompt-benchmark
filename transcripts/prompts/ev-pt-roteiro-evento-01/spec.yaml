id: ev-pt-roteiro-evento-01
lang: pt
translation_key: ev-run-of-show
profession: event-planners
task: event-planners.run-of-show
jurisdictions:
- BR
title: Roteiro minuto a minuto de evento corporativo com conflitos e dois ajustes
scenario: Transforme notas de um evento fictício em roteiro com horários, responsáveis e deixas técnicas. Confira
  conflitos e prepare duas alternativas que preservem os blocos obrigatórios.
input_placeholder: '[Cole as notas: início e término, blocos, durações, responsáveis, deixas técnicas, itens obrigatórios
  e restrições. Substitua nomes de pessoas, clientes e fornecedores por nomes fictícios]'
prompt: 'Atue como produtor de eventos corporativos no Brasil. Monte o roteiro minuto a minuto a partir das notas
  abaixo.

  1. Apresente o roteiro original em tabela: início, fim, bloco, duração em minutos, responsável e deixas técnicas,
  seguindo a ordem das notas.

  2. Confira a soma das durações, o término e as restrições dos participantes; explique eventuais divergências e
  conflitos com os cálculos, em até 120 palavras.

  3. Apresente duas alternativas distintas de ajuste, cada uma em tabela completa, começando no horário previsto
  e terminando até o limite, com horários consecutivos e soma das durações.

  Nos ajustes, você pode reordenar os blocos, salvo restrições expressas de posição; preserve todos os blocos, as
  durações obrigatórias, os mínimos e as restrições dos participantes.

  4. Liste informações ausentes e confirmações necessárias com cliente, palestrantes e fornecedores antes de enviar
  o roteiro.

  Use apenas as notas e os cálculos derivados delas; não invente nomes, responsáveis, chegadas, fornecedores, datas,
  valores, leis, normas ou decisões judiciais.

  Para responsáveis e deixas técnicas ausentes, escreva "a definir" ou equivalente; não apresente sugestões como
  informações confirmadas. Use horários no formato 14h00.

  Indique que as alternativas precisam de validação do cliente e da equipe técnica antes do evento.

  Notas do evento:

  {{INPUT}}

  '
input: 'Todos os nomes, organizações, contratos e demais dados deste exemplo são fictícios.

  Evento: Encontro Anual de Parceiros 2026 — Exemplo Logística Ltda. (fictícia)

  Local: Espaço Exemplo Eventos (fictício), salão principal. Data: 12/11/2026.

  Horário: 14h00 às 18h30. O salão tem que ser liberado às 18h30 em ponto (regra do espaço, sem tolerância).

  Credenciamento a partir das 13h30 (fora do roteiro). Mestre de cerimônias: Beto Exemplo.

  Técnica: Exemplo Som e Luz (fictícia). Buffet: Buffet Exemplo (fictício).


  Blocos, na ordem que pensei:

  1. Abertura — Ana Exemplo (CEO) — 15 min — OBRIGATÓRIO. Vinheta de abertura no telão + trilha alta, depois luz
  geral.

  2. Apresentação de resultados — Martin Exemplo (diretor comercial) — 45 min — OBRIGATÓRIO. Slides no telão, passador,
  microfone de mão.

  3. Coffee break — Buffet Exemplo — 30 min. Pelo contrato do buffet, mínimo de 20 min.

  4. Palestra convidada "Logística em 2027" — Dra. Lúcia Exemplo — 50 min — OBRIGATÓRIO, duração integral por contrato.
  Microfone de lapela. ATENÇÃO: ela avisou que só chega ao local às 15h40 (vem de outro compromisso); pode subir
  ao palco assim que chegar, a apresentação já está com a técnica.

  5. Painel com parceiros — 3 parceiros, moderador a confirmar — 60 min. Pode encurtar, mínimo 40 min.

  6. Premiação dos parceiros do ano — Carla Exemplo (RH) — 40 min — OBRIGATÓRIO. Trilha de premiação, foco de luz
  no palco, troféus na lateral.

  7. Encerramento — Ana Exemplo — 10 min — OBRIGATÓRIO, sempre depois da premiação.

  8. Coquetel de networking — Buffet Exemplo — 40 min. Pode encurtar até 30 min. Tem que ser o último bloco.


  Pelas minhas contas, fecha certinho em 4h30. A palestra da Dra. Lúcia fica às 15h30, logo depois do coffee.

  '
rubric:
- id: C1
  criterion: A verificação corrige o total das notas, informando 290 min (4h50), término original às 18h50 e excesso
    de 20 min sobre o limite de 18h30, sem tolerância numérica.
- id: C2
  criterion: A verificação identifica o início original da palestra às 15h30, a chegada às 15h40 e a antecedência
    indevida de 10 min, sem tolerância numérica, e seu texto explicativo tem até 132 palavras (limite de 120 com
    tolerância de 10%, sem mínimo).
- id: C3
  criterion: A tabela original contém os oito blocos na ordem das notas, com início, fim, duração, responsável e
    deixas técnicas fornecidas ou indicação de informação ausente, em sequência contínua das 14h00 às 18h50, com
    cada intervalo correspondente à duração informada.
- id: C4
  criterion: As duas alternativas são distintas e apresentam tabelas completas dos oito blocos, com soma explícita
    e correta de até 270 min, início às 14h00, intervalos consecutivos e término até 18h30; ambas preservam abertura
    de 15 min, resultados de 45 min, palestra de 50 min, premiação de 40 min e encerramento de 10 min, iniciam a
    palestra às 15h40 ou depois, mantêm coffee break de pelo menos 20 min, painel de pelo menos 40 min e coquetel
    de pelo menos 30 min, com encerramento depois da premiação e coquetel por último, sem tolerância numérica.
- id: C5
  criterion: 'SEGURANÇA: a resposta não apresenta informações ausentes como fatos nem faz afirmações regulatórias,
    mantém o moderador como pendente, lista ao menos uma informação ou confirmação necessária e declara que as alternativas
    dependem de validação do cliente e da equipe técnica.'
