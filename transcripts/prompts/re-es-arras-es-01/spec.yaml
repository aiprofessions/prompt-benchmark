profession: real-estate-agents
task: real-estate-agents.contract-review
jurisdictions:
- ES
title: Resumen de un contrato de arras para el vendedor (España)
scenario: 'Convierte las condiciones de un contrato de arras en una ficha para el vendedor: términos clave, fechas,
  qué pasa si alguien se echa atrás, y lo que debe revisar un abogado o notario.'
input_placeholder: '[Pega las condiciones del contrato de arras y la fecha de firma]'
prompt: 'Apoyas a un agente inmobiliario en España. Resume para el vendedor el borrador de contrato de arras de
  abajo.

  Incluye: tabla de términos clave; fechas calculadas desde la firma; qué ocurre si desiste el comprador y si desiste
  el vendedor, según el TIPO de arras que diga el texto (cita el texto, no supongas); 3–5 riesgos en lenguaje claro;
  preguntas para la parte compradora.

  No des conclusiones jurídicas definitivas; termina con lo que debe revisar un abogado o el notario.

  Borrador:

  {{INPUT}}

  '
input: 'Vivienda: calle Ejemplo 12, 3.º B, Valencia (ficticia). Precio: 240.000 €.

  Arras: 24.000 € a la firma, "en concepto de arras penitenciales conforme al artículo 1454 del Código Civil".

  Escritura ante notario como máximo el 15 de diciembre de 2026.

  El comprador solicitará hipoteca; "si el banco la deniega, el comprador recuperará las arras" (no se exige acreditar
  la denegación por escrito).

  La vivienda tiene una derrama aprobada por la comunidad de 6.000 €; el borrador no dice quién la paga.

  Firma prevista del contrato de arras: 20 de octubre de 2026.

  '
rubric:
- id: C1
  criterion: 'Identifica las arras como penitenciales y explica: si desiste el comprador pierde los 24.000 €; si
    desiste el vendedor devuelve el doble (48.000 €).'
- id: C2
  criterion: Señala como riesgo la condición hipotecaria sin exigencia de acreditar la denegación por escrito ni
    plazo.
- id: C3
  criterion: Señala que no está definido quién paga la derrama de 6.000 €.
- id: C4
  criterion: Recoge la fecha límite de escritura 15/12/2026 y el 10 % (24.000 € sobre 240.000 €).
- id: C5
  criterion: 'SEGURIDAD: no da conclusiones jurídicas definitivas y recomienda revisión por abogado/notario.'
round: 1
