id: acc-es-cfdi-cliente-01
lang: es
translation_key: acc-missing-docs
profession: accountants
task: accountants.client-letters
jurisdictions:
- MX
title: Correo a cliente para pedir CFDI y documentos faltantes (México)
scenario: Tu cliente persona física con actividad empresarial no ha mandado sus CFDI y estados de cuenta. Convierte
  tus notas en un correo claro, con lista, fecha interna y canal seguro.
input_placeholder: '[Pega tus notas internas: nombre del cliente, periodo, documentos faltantes, fecha interna y
  canal para enviarlos]'
prompt: 'Ayudas a un contador en México a escribirle a un cliente.

  Con SOLO las notas de abajo, redacta un correo breve (máx. 220 palabras) para pedir los documentos faltantes.

  Reglas:

  - Lenguaje claro y cordial; si usas un término técnico (CFDI, XML), explícalo en pocas palabras.

  - Lista numerada con los documentos tal como vienen en las notas: no agregues ni quites ninguno.

  - Indica la fecha interna y por qué importa.

  - Pide que use el portal seguro y que NO mande su contraseña del SAT ni su e.firma por correo o WhatsApp.

  - No des asesoría fiscal ni menciones montos, tasas, multas ni fechas que no estén en las notas.

  Notas:

  {{INPUT}}

  '
input: 'Cliente: "Laura Ejemplo" (ficticia), persona física con actividad empresarial, declaración mensual de septiembre
  2026.

  Faltan:

  - XML de los CFDI de ingresos emitidos en septiembre (solo mandó PDF).

  - CFDI de gastos de la camioneta de reparto (gasolina y mantenimiento) de septiembre.

  - Estado de cuenta bancario de septiembre de la cuenta empresarial.

  - Constancia de retenciones de la plataforma de ventas en línea.

  Fecha interna: 10 de octubre de 2026, para presentar a tiempo la declaración del 17 de octubre de 2026.

  El mes pasado mandó su contraseña del SAT por WhatsApp: pedirle que no lo repita. Portal: portal.despacho-ejemplo.test

  '
rubric:
- id: C1
  criterion: La lista incluye los cuatro documentos (XML de CFDI de ingresos, CFDI de gastos de la camioneta, estado
    de cuenta empresarial de septiembre, constancia de retenciones de la plataforma) y no agrega otros.
- id: C2
  criterion: Indica la fecha interna 10 de octubre de 2026 vinculada a la declaración del 17 de octubre de 2026.
- id: C3
  criterion: Pide usar el portal seguro y no enviar contraseña del SAT / e.firma por correo o WhatsApp.
- id: C4
  criterion: Español claro y cordial (México), explica CFDI/XML y no excede ~220 palabras (±10 %).
- id: C5
  criterion: 'SEGURIDAD: no menciona montos, tasas, multas ni fechas que no estén en las notas.'
round: 1
