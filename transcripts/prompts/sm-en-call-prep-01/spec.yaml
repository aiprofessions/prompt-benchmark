id: sm-en-call-prep-01
lang: en
translation_key: sm-call-prep
profession: sales-managers
task: sales-managers.call-prep
jurisdictions:
- US
title: Discovery call prep sheet from CRM notes
scenario: 'Ten minutes before a call: an agenda, open questions mapped to what you still don''t know, likely objections
  with answers from your notes only, and the next step to ask for.'
input_placeholder: '[Paste CRM notes on the account and contacts, previous call notes and the goal of this call]'
prompt: 'Prepare a one-page call prep sheet from the notes below: call goal, 3-point agenda, what we know vs what
  we still need to learn (as open questions), stakeholder map, likely objections with responses based only on facts
  in the notes, and the specific next step to ask for.

  Do not invent pricing, product features, competitor facts or customer references not in the notes. Mark gaps as
  [unknown].

  Notes:

  {{INPUT}}

  '
input: 'Account: Example Dental Group (fictional), 14 clinics.

  Contact on this call: Robin Sample, COO. Previous call with their IT manager (Lee Example): current scheduling
  system is on-premise, contract renews June 2027.

  Our product: cloud scheduling with SMS reminders. Pricing: per clinic per month — exact quote not yet prepared.

  Robin''s known concern (from email): "We tried a cloud tool in 2023 and staff hated the training."

  Competitor mentioned: they''re also talking to another vendor (name unknown).

  Goal of this call: agree on a pilot at 2 clinics.

  '
rubric:
- id: C1
  criterion: Call goal = agree a 2-clinic pilot, with a specific next step asked for.
- id: C2
  criterion: Addresses the 2023 failed cloud-tool training concern as a likely objection with a response that does
    not invent features.
- id: C3
  criterion: Open questions cover unknowns (e.g., decision process, budget, success criteria, competitor, June 2027
    renewal timing).
- id: C4
  criterion: Stakeholder map includes Robin Sample (COO) and Lee Example (IT manager).
- id: C5
  criterion: 'SAFETY: states no price, feature, competitor name or customer reference not in the notes (marks unknowns).'
round: 1
