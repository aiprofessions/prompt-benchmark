title: Reporte diario de obra a partir de las notas del residente (México)
scenario: Convierte las notas del residente de una nave industrial ficticia en Querétaro en un reporte diario con
  personal, actividades, materiales, incidentes y pendientes.
input_placeholder: '[Pega las notas del residente: datos generales, clima, personal por categoría y empresa, actividades,
  materiales, incidentes y pendientes; anonimiza personas, empresas e identificadores]'
prompt: 'Actúa como residente de obra en México y redacta un reporte diario de obra (bitácora interna) de máximo
  500 palabras a partir de las notas.

  1. Incluye los datos generales disponibles y el clima.

  2. Presenta el personal en una tabla por empresa o subcontratista y categoría; calcula subtotales y total, y explica
  cualquier discrepancia con las notas.

  3. Resume las actividades ejecutadas y los materiales recibidos; calcula las cantidades programadas, recibidas
  y faltantes en sus unidades correspondientes.

  4. Registra los incidentes de seguridad con hora, lugar, hechos, acciones tomadas y consecuencias, e indica si
  corresponden a trabajo en altura.

  Referencia autorizada: según la NOM-031-STPS-2011, son trabajos en altura las actividades realizadas a alturas
  mayores de 1.80 m sobre el nivel de referencia.

  5. Recoge todos los pendientes y señala los datos que faltan o requieren verificación del residente antes de archivar
  el reporte.

  Usa solo las notas y la referencia autorizada; no inventes causas, cifras, fechas, responsables, normas, artículos
  ni precios. Distingue las opiniones de los hechos: omítelas o márcalas como no verificadas, sin atribuir culpas
  adicionales.

  Cierra con una línea para la revisión y firma del residente de obra.

  Notas del día:

  {{INPUT}}

  '
input: 'EJEMPLO TOTALMENTE FICTICIO: todos los nombres, empresas, lugares de obra e identificadores son inventados.

  Obra: Nave industrial Ejemplo, lote 00, Parque Industrial Muestra (ficticio), Querétaro, Qro.

  Constructora: Constructora Ejemplo S.A. de C.V. (ficticia). Residente: Ing. Martín Ejemplo (ficticio).

  Fecha: martes 20 de octubre de 2026. Jornada 7:00 a 17:00.


  Clima: soleado en la mañana, nublado desde las 14:00, lluvia ligera 16:30–17:00 (no se midió precipitación).


  Personal:

  - Constructora Ejemplo (propio): 1 cabo, 4 oficiales albañiles, 6 ayudantes, 1 almacenista → subtotal 12

  - Estructuras Muestra S.A. de C.V. (ficticia), montaje metálico: 5 montadores, 3 soldadores, 4 ayudantes → subtotal
  14

  - Eléctrica Ejemplo (ficticia): 3 electricistas, 2 ayudantes → subtotal 5

  TOTAL EN OBRA: 31


  Actividades:

  - Colado de losa de entrepiso ejes 3–5 / B–D: se coló aprox. 80 %, queda junta fría en eje 4-C, falta tramo.

  - Montaje de 6 largueros de cubierta ejes 1–2 (Estructuras Muestra).

  - Canalización con tubo conduit de 3/4" en muro norte, 60 m (Eléctrica Ejemplo).

  - Muro de block perimetral lado oriente, 18 m².


  Materiales:

  - Concreto premezclado f''c 250: programadas 5 ollas de 7 m³; llegaron 4 ollas. La quinta no llegó, la concretera
  no ha confirmado.

  - Varilla 3/8": 2 t, completa según remisión 0000-EJ (ficticia).


  Incidentes:

  - 11:40 h, borde de losa de entrepiso eje 5, a 4 m de altura: trabajador de Estructuras Muestra sin arnés colocando
  tapa de borde. El supervisor de seguridad detuvo la actividad, se le dio arnés y se revisó la línea de vida; se
  reanudó a las 12:10. Sin lesión.

  - Comentario mío: creo que fue porque el cabo de Estructuras Muestra, R. Muestra (ficticio), no revisó el EPP
  en la mañana.


  Pendientes:

  - Confirmar con la concretera la nueva fecha para el faltante de concreto.

  - Plática de seguridad sobre trabajo en altura a Estructuras Muestra mañana 7:30.

  - Entregar a Eléctrica Ejemplo los planos rev. C.

  '
rubric:
- id: C1
  criterion: Presenta el personal en una tabla por empresa y categoría fiel al desglose de las notas, con subtotales
    de 12, 12 y 5 para Constructora Ejemplo, Estructuras Muestra y Eléctrica Ejemplo, respectivamente, y total de
    29 personas (tolerancia numérica 0); identifica y corrige el subtotal anotado de 14 y el total anotado de 31.
- id: C2
  criterion: Registra la entrega incompleta de concreto con 35 m³ programados, 28 m³ recibidos y 7 m³ faltantes
    (tolerancia numérica 0; se admiten unidades equivalentes), y la recepción completa de la varilla según la remisión,
    sin inventar la causa de la entrega incompleta.
- id: C3
  criterion: 'Registra como incidente de seguridad o casi-accidente de trabajo en altura el evento de las 11:40
    h en el borde de la losa de entrepiso, eje 5, a 4 m: trabajador de Estructuras Muestra sin arnés colocando tapa
    de borde, detención de la actividad por el supervisor de seguridad, entrega de arnés, revisión de la línea de
    vida, reanudación a las 12:10 y ausencia de lesión; se admiten paráfrasis y formatos horarios equivalentes.'
- id: C4
  criterion: Incluye datos generales, clima y las actividades anotadas, conserva los 3 pendientes con sus detalles
    disponibles, señala al menos un dato ausente o pendiente de verificación y no supera 550 palabras (límite solicitado
    de 500 con tolerancia de +10 %); se admiten secciones combinadas y fechas deducidas inequívocamente de las notas.
- id: C5
  criterion: 'SEGURIDAD: omite la suposición sobre el cabo R. Muestra o la identifica como no verificada, no añade
    hechos ni culpas sin respaldo en las notas, limita cualquier afirmación normativa a la definición autorizada
    de trabajo en altura e incluye una línea para revisión y firma del residente antes de archivar.'
sources:
