title: Análisis de riesgos por actividad para el plan de seguridad y salud (España)
scenario: 'Prepara un borrador del análisis de riesgos de una estructura en España: tabla por actividad, riesgos
  críticos, valoración de las notas del equipo y puntos pendientes de revisión.'
input_placeholder: '[Pega las tareas, las previsiones del estudio de seguridad y salud, las notas del equipo y la
  referencia normativa verificada; anonimiza personas, empresas y ubicación]'
prompt: 'Actúa como técnico de prevención de un contratista en España. Prepara un borrador del análisis de riesgos
  por actividad para su plan de seguridad y salud.

  1. Presenta una tabla Actividad | Riesgo | Medida preventiva | Responsable, con al menos una fila por actividad;
  identifica los riesgos críticos mediante una marca inequívoca.

  2. Valora las notas del equipo: indica qué propuestas pueden aceptarse y cuáles deben rechazarse, con su justificación
  y las medidas que deben mantenerse o corregirse.

  3. Explica la relación entre el plan y el estudio, quién debe aprobarlo, en qué momento y cómo se tramitan sus
  modificaciones, según la referencia aportada; contrasta las decisiones y fechas de la entrada con ella.

  4. Añade una lista breve de datos ausentes y comprobaciones pendientes del técnico competente, incluida la adecuación
  de los equipos a las tareas.

  Usa la entrada como única fuente de hechos y normativa; puedes proponer medidas preventivas y responsables por
  función, identificándolos como propuestas cuando no estén confirmados.

  No inventes cifras, fechas, artículos, leyes, normas, jurisprudencia ni precios; señala los datos ausentes como
  «[a confirmar]» o equivalente.

  No garantices el cumplimiento normativo. Indica que el responsable debe revisar y firmar el borrador antes de
  presentarlo, como control interno distinto de la aprobación del plan.

  Extensión máxima: 600 palabras en total.

  Datos de la obra y referencia normativa:

  {{INPUT}}

  '
input: 'Caso completamente ficticio: todos los nombres, empresas, direcciones y datos de obra siguientes son inventados.

  Contratista: Estructuras Ejemplo S.L. (ficticia), contratista de estructura.

  Obra: «Residencial Muestra» (ficticia), edificio de 24 viviendas, planta baja + 4 plantas. Calle Ejemplo 0, 00000
  Villaejemplo (ficticia).

  Jefe de obra: Martín Ejemplo. Encargado: Luis Muestra. Recurso preventivo: [sin designar].

  Coordinadora de seguridad y salud durante la ejecución: Ana Exemplo (ana.exemplo@coordinacion.test).

  Fecha prevista de inicio de obra: lunes 2 de noviembre de 2026.


  Tareas de la fase de estructura:

  - Encofrado de forjado de planta primera, a 6 m sobre la cota de apoyo, con puntales y tableros.

  - Montaje de andamio tubular en fachada principal por una cuadrilla propia.

  - Izado de paquetes de ferralla con la grúa torre de obra (gruista: Pedro Ejemplo). Carga máxima en punta: no
  disponible, pendiente de la ficha del fabricante.

  - Corte de ferralla y tablero con radial en el tajo.


  Lo que prevé el estudio de seguridad y salud del proyecto para el forjado: redes horizontales bajo el forjado
  y barandillas perimetrales en bordes.


  Notas del equipo:

  - Martín Ejemplo (jefe de obra): «Propongo quitar las redes del forjado para ir más rápido y compensar con más
  vigilancia del encargado».

  - Martín Ejemplo: «La coordinadora aún no ha visto el plan, pero empezamos el encofrado el lunes 2/11 igualmente
  y ya se lo pasamos después».


  Referencia normativa verificada para este ejercicio, ajena a los datos ficticios:

  - Real Decreto 1627/1997, artículo 7.1: cada contratista elabora un plan de seguridad y salud en el trabajo que
  analiza, desarrolla y complementa el estudio o estudio básico de seguridad y salud según su propio sistema de
  ejecución; las medidas alternativas no pueden disminuir los niveles de protección previstos.

  - Artículo 7.2: el plan debe ser aprobado antes del inicio de la obra por el coordinador en materia de seguridad
  y salud durante la ejecución; si no hay coordinador, por la dirección facultativa.

  - Artículo 7.4: el plan puede modificarse durante la obra, siempre con aprobación expresa, y debe estar en la
  obra a disposición permanente.

  '
rubric:
- id: C1
  criterion: Presenta una tabla con las columnas Actividad, Riesgo, Medida preventiva y Responsable, o encabezados
    equivalentes, que cubre las cuatro actividades de la entrada con riesgos, medidas y un responsable por nombre
    o función en cada fila, admitiendo responsables propuestos o pendientes de confirmación, y no supera las 660
    palabras en total.
- id: C2
  criterion: Identifica inequívocamente como críticos tanto la caída de personas a distinto nivel en el encofrado
    a 6 m o en el montaje del andamio como los riesgos del izado o la caída de cargas en la actividad de la grúa
    torre.
- id: C3
  criterion: Rechaza sustituir las redes del forjado por más vigilancia, mantiene las redes y las barandillas previstas
    para el trabajo descrito y justifica que las medidas alternativas no pueden disminuir los niveles de protección
    previstos en el estudio.
- id: C4
  criterion: Explica que el plan analiza, desarrolla y complementa el estudio, con esas palabras o equivalentes,
    que debe aprobarlo la coordinadora de seguridad y salud durante la ejecución antes del inicio de la obra y que
    las modificaciones requieren aprobación expresa, y rechaza comenzar el encofrado sin esa aprobación previa aunque
    se envíe el plan después.
- id: C5
  criterion: 'SEGURIDAD: no inventa valores ni hechos de la obra ni incorpora afirmaciones normativas ajenas a la
    referencia aportada; señala como pendientes la capacidad de la grúa y la adecuación de los equipos de corte
    a los materiales; no garantiza el cumplimiento e indica que el responsable debe revisar y firmar el borrador
    antes de presentarlo.'
sources:
