id: id-pt-proposta-honorarios-01
lang: pt
translation_key: id-proposal
title: Proposta de honorários de design de interiores por m² com visitas de obra avulsas
scenario: Transforme notas de metragem, preços e visitas em uma proposta com etapas, valores conferidos, parcelas e exclusões,
  sem prometer prazo de obra.
profession: interior-designers
task: interior-designers.client-proposals
tools: []
model: chatgpt
tested_with: gpt-6-astra
tested_date: '2026-10-19'
jurisdictions:
- BR
prompt: 'Atue como designer de interiores no Brasil e prepare um rascunho de proposta para o cliente, com até 600 palavras,
  usando as notas abaixo.

  1. Apresente brevemente o serviço e o escopo de estudo preliminar, anteprojeto, projeto executivo e acompanhamento por visitas
  avulsas.

  2. Monte uma tabela com preço por m² × metragem, visitas × preço unitário, subtotais e total geral; mostre as contas e use
  o formato R$ 1.234,56.

  3. Informe as parcelas, seus valores e eventos de cobrança, separando os honorários de projeto das visitas cobradas por
  realização.

  4. Inclua todos os itens não inclusos, prazos de entrega dos projetos, validade, meios de pagamento e condições de revisão
  informados.

  5. Acrescente uma lista interna separada, de até 120 palavras, com divergências, pedidos incompatíveis com o escopo, dados
  faltantes e verificações antes do envio.

  Use somente as notas; confira os cálculos e diferencie dados confirmados, rascunhos e pedidos do cliente, sem assumir compromissos
  de terceiros.

  Não invente valores, metragens, datas ou registros profissionais e não faça afirmações legais ou regulatórias; marque dados
  faltantes como [A CONFIRMAR].

  Limite os compromissos de prazo às entregas de projeto informadas; explique que a execução depende de terceiros, como responsáveis
  pela obra e fornecedores.

  Na lista interna, registre eventuais correções e exclusões necessárias e a necessidade de revisão, ajuste e assinatura pela
  designer antes do envio.

  Notas da designer:

  [Cole metragem, preços por m², escopo, visitas, parcelas, prazos dos projetos, revisões, validade e exclusões; anonimեք
  nomes, documentos, contatos e endereço]

  '
sample_input: 'Todos os nomes, contatos e dados deste exemplo são fictícios.

  Designer: Ana Exemplo Design de Interiores (fictícia) — CNPJ 00.000.000/0000-00 (fictício) — ana@exemplo.test

  Cliente: Martin Exemplo (fictício) — martin@exemplo.test

  Imóvel: apartamento residencial, Rua Exemplo, 100, apto 00, São Paulo/SP (endereço fictício). Reforma de interiores completa,
  sem alteração estrutural informada.

  Metragem para cálculo: 120 m² de área privativa (planta do condomínio). Vaga de garagem não entra.

  Preços por m²:

  - Estudo preliminar (levantamento, layout, conceito e painel de referências): R$ 40,00/m²

  - Anteprojeto (layout revisado, 3D dos ambientes, especificação inicial): R$ 55,00/m²

  - Projeto executivo (detalhamento de marcenaria, paginação de pisos, forro, iluminação, pontos de layout, caderno de especificações):
  R$ 80,00/m²

  Acompanhamento de obra: visitas avulsas a R$ 450,00 cada; cliente quer pacote inicial de 6 visitas, cobradas conforme forem
  realizadas.

  Pagamento dos honorários de projeto: 30% na assinatura, 20% na entrega do estudo preliminar, 25% na entrega do anteprojeto,
  25% na entrega do executivo. Pix ou transferência.

  Prazos de entrega (do projeto, não da obra): estudo preliminar 20 dias úteis após o levantamento; anteprojeto 25 dias úteis
  após aprovação do estudo; executivo 30 dias úteis após aprovação do anteprojeto.

  Revisões: 2 rodadas por etapa; revisões extras: valor ainda não definido.

  Não incluso: execução da obra e mão de obra, marcenaria e mobiliário, compra de materiais e acabamentos, projetos complementares
  (elétrico, hidráulico, ar-condicionado), taxas e aprovações do condomínio, visitas além das 6 (R$ 450,00 cada).

  Validade da proposta: 15 dias.

  Rascunho meu: projeto 175 × 120 = R$ 22.000,00; + visitas = R$ 24.700,00 de total.

  Mensagem do cliente: "Ana, coloca na proposta que a obra fica pronta em 60 dias, preciso me mudar antes do Natal."

  '
