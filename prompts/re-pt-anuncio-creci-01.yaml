id: re-pt-anuncio-creci-01
lang: pt
translation_key: re-listing-fh
title: Anúncio de apartamento em lançamento com CRECI e registro de incorporação (Brasil)
scenario: 'Notas da imobiliária e pedidos do proprietário: gere anúncio para portal e Instagram com CRECI e registro da incorporação,
  sem frases discriminatórias nem promessa de valorização.'
profession: real-estate-agents
task: real-estate-agents.listing-copy
tools: []
model: chatgpt
tested_with: gpt-6-astra
tested_date: '2026-10-19'
jurisdictions:
- BR
prompt: 'Você é corretor(a) de imóveis no Brasil e vai preparar duas peças de divulgação com base nas notas abaixo.

  Verifique nas notas se existe autorização escrita de venda ou contrato de intermediação por escrito; se não houver, não
  redija as peças e indique o que falta.

  1. Anúncio para portal (até 180 palavras, incluindo título): título, descrição, características e valores informados, CRECI
  da imobiliária e, para imóvel em condomínio ou loteamento, o registro da incorporação ou do loteamento no Registro de Imóveis.

  2. Legenda para Instagram (até 120 palavras, incluindo eventuais hashtags), com o mesmo CRECI e o mesmo registro aplicável.

  3. Lista "Removido / a conferir": identifique cada informação retirada ou condicionada, com motivo e conferência necessária;
  resuma os trechos inadequados sem precisar reproduzi-los.

  Use somente as notas; não invente características, números, preços, datas, leis, artigos, jurisprudência ou normas, nem
  acrescente explicações jurídicas ausentes delas.

  Exclua linguagem discriminatória e promessas de valorização ou rentabilidade; preserve as ressalvas sobre estimativas, previsões
  e imagens ilustrativas.

  Para dados não conferidos documentalmente, omita-os ou indique expressamente que estão a confirmar; liste a documentação
  que o responsável precisa conferir.

  Não reproduza nome, CPF, celular ou e-mail do proprietário em nenhuma parte da resposta; mantenha clara a natureza fictícia
  dos exemplos.

  Termine lembrando que o corretor responsável deve conferir os dados e aprovar o texto antes da publicação.

  Notas da imobiliária:

  [Cole as notas do imóvel: CRECI da imobiliária, autorização de venda, registro da incorporação, características, preço e
  pedidos do proprietário. Anonimize nomes e retire CPF, celular e e-mail pessoais]

  '
sample_input: 'Exemplo inteiramente fictício para treinamento; nomes, identificadores e dados não correspondem a uma oferta
  real.

  Imobiliária: Exemplo Imóveis Ltda. (fictícia) — CRECI J-00000 (fictício). Corretora responsável: Ana Exemplo (fictícia).

  Proprietário: Martin Exemplo (fictício), CPF 000.000.000-00 (fictício), celular (XX) XXXXX-XXXX (marcador fictício), e-mail
  martin@exemplo.test.

  Autorização de venda: por escrito, assinada pelo proprietário em 05/10/2026, com exclusividade até 05/01/2027.

  Imóvel: apartamento 804 do Residencial Jardim Exemplo (fictício), Rua Exemplo, 100 — Curitiba/PR.

  Empreendimento novo (lançamento) da Exemplo Incorporações (fictícia). Registro de incorporação: R-3 da matrícula 12.345
  (fictícia) do Registro de Imóveis competente de Curitiba.

  Previsão de entrega informada pela incorporadora: dezembro de 2027.

  3 quartos (1 suíte), 1 vaga de garagem, sacada com churrasqueira. Lazer do condomínio: piscina, academia, salão de festas.

  Área: "92 m² privativos, segundo o proprietário" — matrícula individual e memorial de incorporação ainda não conferidos
  pela imobiliária.

  Preço pedido: R$ 685.000,00. Condomínio estimado pela incorporadora: R$ 650,00/mês.

  Fotos: imagens digitais fornecidas pela incorporadora (imagens ilustrativas).

  Pedido do proprietário: "Coloca que é ideal para casal sem filhos, prédio silencioso. E escreve que vai dobrar de valor
  em 2 anos, a região está bombando."

  '
