id: ta-pt-roteiro-viagem-01
lang: pt
translation_key: ta-itinerary
title: Roteiro dia a dia Buenos Aires + Mendoza com conflitos e itens não reservados
scenario: Reservas confirmadas e desejos dos clientes viram um roteiro de 6 dias que usa só os horários dados, aponta conflitos
  de agenda e separa o que ainda não está reservado.
profession: travel-agents
task: travel-agents.itineraries
tools: []
model: claude
tested_with: claude-opus-5-5
tested_date: '2026-10-19'
jurisdictions:
- BR
prompt: 'Você é agente de viagens no Brasil. Monte um roteiro dia a dia para os clientes a partir das reservas e dos desejos
  abaixo.

  1. Roteiro para todos os dias do período (data, cidade, horários em ordem), com cada serviço ou atividade marcado "RESERVADO"
  ou "NÃO RESERVADO"; no máximo 80 palavras por dia.

  2. Seção "Conflitos de horário": descreva cada conflito citando os horários envolvidos e proponha alternativas sujeitas
  a confirmação, sem decidir pelo cliente nem apresentar compromissos incompatíveis como realizáveis.

  3. Seção "Pendências": o que falta reservar ou confirmar e as informações ausentes, inclusive preços solicitados que não
  tenham sido fornecidos.

  4. Lembrete de documentos: sinalize informações documentais não verificadas e oriente os clientes a conferir os documentos
  de viagem na fonte oficial, sem afirmar qual documento é aceito.

  Regras: use só as datas, horários e serviços informados, mantendo cada horário associado ao respectivo serviço; para itens
  sem horário, escreva "horário a confirmar".

  Não invente números, preços, datas, regras de entrada ou exigências legais; não garanta disponibilidade nem trate pedidos
  em andamento como reservas confirmadas.

  Ao final, indique que o roteiro é um rascunho a ser revisado pelo agente antes do envio ao cliente.

  Dados:

  [Cole as reservas confirmadas (voos, hotéis, passeios com horários), os desejos dos clientes e as observações; troque nomes
  e localizadores por dados fictícios]

  '
sample_input: 'Agência: Viagens Exemplo (fictícia) – contato@viagens-exemplo.test

  Clientes: Ana Exemplo e Carlos Exemplo (casal, adultos), saindo de São Paulo.

  Período: 10/11/2026 (terça) a 15/11/2026 (domingo).


  RESERVAS CONFIRMADAS

  - 10/11: voo EX 1001 da Aerolínea Exemplo (fictícia), GRU 10h30 → Aeroparque (AEP) chegada 13h55.

  - 10/11 a 13/11: Hotel Exemplo Palermo (fictício), Buenos Aires, check-in a partir das 15h.

  - 10/11: jantar com show de tango na Casa de Tango Exemplo (fictícia), 20h30.

  - 11/11: city tour em Buenos Aires, 9h00 às 13h00, saída do hotel.

  - 13/11: voo EX 2040, AEP 7h40 → Mendoza (MDZ) chegada 9h35.

  - 13/11: passeio de bicicleta guiado em San Telmo (Buenos Aires), 9h00, ponto de encontro na Plaza Dorrego.

  - 13/11 a 15/11: Pousada Exemplo Mendoza (fictícia), check-in a partir das 14h, check-out até 11h.

  - 14/11: tour de vinícolas na Bodega Exemplo (fictícia), 10h00; traslado busca na pousada às 9h15.

  - 15/11: voo EX 3015, MDZ 15h10 → GRU.


  DESEJOS / PEDIDOS EM ANDAMENTO

  - 12/11: os clientes querem conhecer o Tigre (nada reservado, sem horário definido).

  - 14/11: almoço na Bodega Exemplo após o tour – pedido enviado, aguardando confirmação.

  - 15/11: traslado da pousada ao aeroporto de Mendoza – ainda não contratado.

  - Tarde de 11/11 livre; gostariam de ir a La Boca/Caminito (sem reserva).


  OBSERVAÇÕES DOS CLIENTES

  - "Minha cunhada disse que para a Argentina basta levar a CNH. Confirma isso no roteiro, por favor."

  - "Quanto custa o almoço na vinícola? Coloca o valor no roteiro."

  '
