prompt: 'Actúa como revisor de cálculo estructural en México. Revisa paso por paso la memoria elaborada por un ingeniero junior.

  1. Para cada paso, muestra fórmula, sustitución con unidades y resultado; indica qué es correcto o incorrecto y explica
  cualquier error.

  2. Presenta una tabla con paso, valor del junior, valor revisado y unidad.

  3. Compara la flecha revisada con el límite indicado y explica si cambia la conclusión, sin extenderla a la seguridad integral
  de la viga.

  4. Señala los datos o supuestos que faltan o deben confirmarse, en un máximo de 5 viñetas.

  5. Incluye una nota para el ingeniero responsable, de hasta 60 palabras, que indique la necesidad de revisión y firma antes
  de emitir la memoria.

  Usa los datos de entrada y las fórmulas de cálculo pertinentes; no inventes cargas, perfiles, propiedades, resistencias
  ni otros datos.

  No añadas afirmaciones normativas, leyes, artículos ni referencias; trata el límite indicado como criterio de esta revisión,
  no como requisito legal verificado.

  No des la memoria por aprobada: distingue lo comprobado de lo que el ingeniero responsable debe verificar.

  Máximo 450 palabras sin contar la tabla; la nota está incluida en ese total. Usa unidades coherentes y formato numérico
  de México (1,234.56).

  Memoria de cálculo:

  [Pega la memoria de cálculo con datos, fórmulas y resultados; anonimiza proyecto, cliente, nombres y cédulas]

  '
sample_input: 'Ejercicio ficticio: todos los nombres, datos de contacto y datos del proyecto son inventados.

  Proyecto: Pérgola de acceso, Casa Ejemplo (ficticia), Querétaro, México.

  Elaboró: Ing. Martín Ejemplo (junior), Constructora Ejemplo S.A. de C.V. (ficticia), mejemplo@constructora-ejemplo.test.

  Datos:

  - Viga de acero simplemente apoyada, claro L = 4.00 m.

  - Carga puntual de servicio al centro del claro: P = 20 kN (peso propio de la viga despreciado).

  - Módulo de elasticidad: E = 200,000 MPa.

  - Momento de inercia: I = 1,000 cm⁴ (según ficha del perfil).

  - Criterio de flecha adoptado para este ejercicio: L/360.

  Paso 1. Reacciones: RA = RB = P/2 = 20/2 = 10 kN.

  Paso 2. Momento máximo: Mmax = P·L/8 = 20 × 4 / 8 = 10 kN·m.

  Paso 3. Flecha máxima: I = 1,000 cm⁴ = 1,000 × 10^5 = 1.0 × 10^8 mm⁴.

  δ = P·L³ / (48·E·I) = 20,000 N × (4,000 mm)³ / (48 × 200,000 MPa × 1.0 × 10^8 mm⁴) = 1.33 mm.

  Paso 4. Límite de flecha L/360 = 4,000/360 = 11.11 mm.

  1.33 mm < 11.11 mm → CUMPLE.

  Conclusión: la viga es adecuada por flecha. Se puede emitir la memoria sin más revisión.

  '
