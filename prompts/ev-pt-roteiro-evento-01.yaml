id: ev-pt-roteiro-evento-01
lang: pt
translation_key: ev-run-of-show
title: Roteiro minuto a minuto de evento corporativo com conflitos e dois ajustes
scenario: Transforme notas de um evento fictício em roteiro com horários, responsáveis e deixas técnicas. Confira conflitos
  e prepare duas alternativas que preservem os blocos obrigatórios.
profession: event-planners
task: event-planners.run-of-show
tools: []
model: chatgpt
tested_with: gpt-6-astra
tested_date: '2026-10-19'
jurisdictions:
- BR
prompt: 'Atue como produtor de eventos corporativos no Brasil. Monte o roteiro minuto a minuto a partir das notas abaixo.

  1. Apresente o roteiro original em tabela: início, fim, bloco, duração em minutos, responsável e deixas técnicas, seguindo
  a ordem das notas.

  2. Confira a soma das durações, o término e as restrições dos participantes; explique eventuais divergências e conflitos
  com os cálculos, em até 120 palavras.

  3. Apresente duas alternativas distintas de ajuste, cada uma em tabela completa, começando no horário previsto e terminando
  até o limite, com horários consecutivos e soma das durações.

  Nos ajustes, você pode reordenar os blocos, salvo restrições expressas de posição; preserve todos os blocos, as durações
  obrigatórias, os mínimos e as restrições dos participantes.

  4. Liste informações ausentes e confirmações necessárias com cliente, palestrantes e fornecedores antes de enviar o roteiro.

  Use apenas as notas e os cálculos derivados delas; não invente nomes, responsáveis, chegadas, fornecedores, datas, valores,
  leis, normas ou decisões judiciais.

  Para responsáveis e deixas técnicas ausentes, escreva "a definir" ou equivalente; não apresente sugestões como informações
  confirmadas. Use horários no formato 14h00.

  Indique que as alternativas precisam de validação do cliente e da equipe técnica antes do evento.

  Notas do evento:

  [Cole as notas: início e término, blocos, durações, responsáveis, deixas técnicas, itens obrigatórios e restrições. Substitua
  nomes de pessoas, clientes e fornecedores por nomes fictícios]

  '
sample_input: 'Todos os nomes, organizações, contratos e demais dados deste exemplo são fictícios.

  Evento: Encontro Anual de Parceiros 2026 — Exemplo Logística Ltda. (fictícia)

  Local: Espaço Exemplo Eventos (fictício), salão principal. Data: 12/11/2026.

  Horário: 14h00 às 18h30. O salão tem que ser liberado às 18h30 em ponto (regra do espaço, sem tolerância).

  Credenciamento a partir das 13h30 (fora do roteiro). Mestre de cerimônias: Beto Exemplo.

  Técnica: Exemplo Som e Luz (fictícia). Buffet: Buffet Exemplo (fictício).


  Blocos, na ordem que pensei:

  1. Abertura — Ana Exemplo (CEO) — 15 min — OBRIGATÓRIO. Vinheta de abertura no telão + trilha alta, depois luz geral.

  2. Apresentação de resultados — Martin Exemplo (diretor comercial) — 45 min — OBRIGATÓRIO. Slides no telão, passador, microfone
  de mão.

  3. Coffee break — Buffet Exemplo — 30 min. Pelo contrato do buffet, mínimo de 20 min.

  4. Palestra convidada "Logística em 2027" — Dra. Lúcia Exemplo — 50 min — OBRIGATÓRIO, duração integral por contrato. Microfone
  de lapela. ATENÇÃO: ela avisou que só chega ao local às 15h40 (vem de outro compromisso); pode subir ao palco assim que
  chegar, a apresentação já está com a técnica.

  5. Painel com parceiros — 3 parceiros, moderador a confirmar — 60 min. Pode encurtar, mínimo 40 min.

  6. Premiação dos parceiros do ano — Carla Exemplo (RH) — 40 min — OBRIGATÓRIO. Trilha de premiação, foco de luz no palco,
  troféus na lateral.

  7. Encerramento — Ana Exemplo — 10 min — OBRIGATÓRIO, sempre depois da premiação.

  8. Coquetel de networking — Buffet Exemplo — 40 min. Pode encurtar até 30 min. Tem que ser o último bloco.


  Pelas minhas contas, fecha certinho em 4h30. A palestra da Dra. Lúcia fica às 15h30, logo depois do coffee.

  '
