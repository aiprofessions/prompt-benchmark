id: ta-pt-condicoes-fornecedor-01
lang: pt
translation_key: ta-supplier-terms
title: Resumo para o cliente das condições de cancelamento de pacote turístico (Brasil)
scenario: 'Cole o texto do fornecedor e as datas: receba a faixa de multa aplicável, os valores retido e devolvido, os itens
  não reembolsáveis e os pontos que dependem de confirmação.'
profession: travel-agents
task: travel-agents.supplier-terms
tools: []
model: chatgpt
tested_with: gpt-6-astra
tested_date: '2026-10-19'
jurisdictions:
- BR
prompt: 'Atue como agente de viagens no Brasil. Use apenas os dados abaixo para preparar um resumo das condições de cancelamento
  para o cliente.

  1. Apresente uma tabela com todas as faixas de multa por antecedência previstas pelo fornecedor.

  2. Calcule a antecedência em dias corridos, excluindo o dia da solicitação e incluindo o dia do embarque, e indique a faixa
  aplicável.

  3. Mostre o cálculo se o cliente cancelar na data informada: base da multa, multa, itens não reembolsáveis, total retido
  e valor devolvido, em reais.

  4. Liste os itens não reembolsáveis com seus valores e informe a forma, o prazo e as condições de reembolso, se constarem
  do texto.

  5. Redija um texto pronto para o cliente, em linguagem simples, com no máximo 200 palavras, identificando os valores como
  simulação das condições do fornecedor.

  6. Inclua a seção "A confirmar pelo agente", com lacunas, divergências e verificações necessárias antes do envio; registre
  que o agente deve revisar e aprovar o resumo.

  Use somente os dados fornecidos e os cálculos derivados deles; não invente números, datas, preços ou condições e não faça
  afirmações regulatórias.

  Se houver divergências entre notas internas, condições do fornecedor e datas, explicite-as e fundamente a simulação nas
  condições e nas datas; dúvidas sobre direitos do consumidor devem ficar a confirmar com orientação jurídica, sem confirmar
  nem negar direitos.

  Atribua as condições ao fornecedor, sem garantir sua validade jurídica, o recebimento de valores ou o cumprimento do prazo.

  Dados:

  [Cole as condições do fornecedor, o valor e a composição do pacote e as datas da solicitação e do embarque. Anonimize nomes,
  e-mails, CPF e dados de cartão]

  '
sample_input: 'EXEMPLO INTEIRAMENTE FICTÍCIO: pessoas, empresa, contato, pacote e condições abaixo foram criados para este
  exercício.

  Clientes: Ana Exemplo e Martin Exemplo (2 adultos). E-mail: ana@exemplo.test

  Fornecedor: Operadora Horizonte Exemplo Turismo Ltda. (fictícia)

  Pacote: Salvador, 7 noites, aéreo + hotel + traslados. Valor total pago: R$ 18.400,00 (cartão, à vista).

  Composição do valor total:

  - Aéreo, hotel e traslados: R$ 17.200,00

  - Taxa de serviço da agência: R$ 800,00

  - Seguro viagem (apólice já emitida): R$ 400,00

  Data de hoje (solicitação de cancelamento): 19/10/2026

  Data de embarque: 10/11/2026


  Texto do fornecedor (cláusula 9 – Cancelamento pelo contratante):

  "Em caso de cancelamento solicitado pelo contratante, será aplicada multa sobre o valor dos serviços terrestres e aéreos,
  conforme a antecedência em dias corridos entre a data da solicitação e a data de embarque:

  - 30 dias ou mais: 10 %

  - de 15 a 29 dias: 30 %

  - menos de 15 dias: 100 %

  A taxa de serviço e o seguro viagem emitido não são reembolsáveis em nenhuma hipótese e não compõem a base da multa. O reembolso
  do saldo será feito na mesma forma de pagamento em até 30 dias após a solicitação formal por e-mail."


  Notas internas do atendimento:

  - "Faltam uns 35 dias para o embarque, então é só a multa de 10 %. Pode tranquilizar a cliente."

  - A cliente escreveu por mensagem: "Li na internet que tenho direito a reembolso integral se cancelar. Confirma?"

  '
