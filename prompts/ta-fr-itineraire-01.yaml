id: ta-fr-itineraire-01
lang: fr
translation_key: ta-itinerary
title: Programme de voyage jour par jour à partir des réservations (Lisbonne et Porto)
scenario: Transformez les réservations et souhaits du client en programme jour par jour, en signalant les incohérences et
  en distinguant les prestations confirmées des activités non réservées.
profession: travel-agents
task: travel-agents.itineraries
tools: []
model: chatgpt
tested_with: gpt-6-astra
tested_date: '2026-10-19'
jurisdictions:
- FR
prompt: 'Vous êtes agent de voyages en France. Préparez un projet de programme destiné au client, en le vouvoyant, à partir
  du dossier ci-dessous.

  1. Programme jour par jour (450 mots maximum, formalités comprises) : indiquez les dates, le nombre total de jours et toutes
  les réservations, avec leurs horaires et références sans en modifier le contenu.

  2. Intégrez chaque souhait du client ; tout élément non confirmé porte la mention « non réservé », sans horaire ni prix.

  3. Encadré « Points à vérifier » pour l’agence (150 mots maximum) : relevez les incohérences et leurs éléments en conflit
  ; calculez les nuits du séjour, celles de chaque hôtel et leur total, et identifiez les éventuels doublons.

  Ne résolvez pas les incohérences à la place de l’agent et ne supprimez ni ne déplacez aucune réservation.

  4. Formalités : invitez à vérifier les documents de voyage auprès d’une source officielle avant le départ, sans énoncer
  vous-même de document exigé, de délai ni de règle.

  Utilisez uniquement le dossier ; n’inventez aucun nombre, horaire, date, prix, adresse, référence, texte juridique ou norme.
  Les décomptes demandés doivent découler des données.

  Signalez les informations manquantes par « à confirmer » et ne présentez aucune affirmation non vérifiée du client comme
  acquise.

  Indiquez que l’agent doit valider ce projet avant tout envoi au client.

  Données du dossier (anonymisées) :

  [Collez les réservations, dates, horaires, références et souhaits du client ; anonymisez les noms, coordonnées et références]

  '
sample_input: 'Dossier entièrement fictif : M. et Mme Martin Exemple (2 adultes). Agence : Voyages Exemple (fictive). Séjour
  du 15/04/2027 au 19/04/2027.

  Réservations confirmées :

  - 15/04 : vol EX 1234 (Exemplo Air, compagnie fictive) Paris-CDG 08h05 → Lisbonne 09h45 (heure locale). Réf. VOL-0001-TEST.

  - Hôtel Lisboa Exemplo (fictif), Lisbonne : arrivée 15/04, départ 18/04, 3 nuits, chambre double. Réf. HTL-0002-TEST.

  - 17/04 : visite guidée « Alfama Exemplo » à 10h00, rendez-vous à Lisbonne (lieu exact communiqué par le guide). Réf. VIS-0003-TEST.

  - 17/04 : train Lisbonne Santa Apolónia 09h12 → Porto Campanhã 12h05. Réf. TRN-0004-TEST.

  - Hôtel Porto Exemplo (fictif), Porto : arrivée 17/04, départ 19/04, 2 nuits. Réf. HTL-0005-TEST.

  - 18/04 : dîner au restaurant Tasca Exemplo (fictif), Porto, à 20h00, 2 couverts. Réf. RES-0006-TEST.

  - 19/04 : vol EX 5678 (Exemplo Air) Porto 18h40 → Paris-CDG 22h05. Réf. VOL-0007-TEST.

  Souhaits du client (rien de réservé) : tram 28 à Lisbonne, une journée à Sintra, croisière sur le Douro, dégustation de
  porto, transfert aéroport à l’arrivée (« je crois que c’est inclus »).

  Note du client (message reçu par courriel, client@exemple.test) : « On nous a dit qu’aucune formalité n’est nécessaire et
  que la carte d’identité suffit, vous pouvez l’écrire dans le programme. »

  '
