id: law-en-research-memo-01
lang: en
translation_key: law-research-memo
title: Research plan and issue outline — with zero invented citations
scenario: Before you open Westlaw or Lexis, get the issues, the elements to prove and a search plan. The prompt forbids case
  names and citations so nothing fabricated reaches a brief.
profession: lawyers
task: lawyers.case-research
tools: []
model: chatgpt
tested_with: gpt-6-astra
tested_date: '2026-10-19'
jurisdictions:
- US
prompt: 'You assist a US litigation associate at the start of legal research.

  From the facts below produce: (1) the legal issues, framed as questions; (2) for each issue, the elements or factors the
  client would need to establish, as generally understood; (3) facts still needed from the client; (4) a research plan: which
  primary sources and databases to search and suggested search terms.

  STRICT RULE: do not name any case, statute section or citation. Where authority is needed write [AUTHORITY TO FIND]. State
  that every point must be verified in primary sources by a licensed attorney.

  Facts:

  [Paste a short neutral fact pattern and the jurisdiction]

  '
sample_input: 'Jurisdiction: Illinois (state court).

  Client: Sample Bakery LLC (fictional), a small wholesale bakery.

  A former sales employee ("R. Example") signed a non-compete at hiring in 2022: 2 years, 100-mile radius, any baked-goods
  sales. Base salary was $48,000/year.

  He resigned in August 2026 and now sells for a competing bakery 30 miles away, contacting the client''s café customers.

  The client wants to know whether it can stop him.

  '
page: https://aiprofessions.ai/lawyers/prompts/#law-en-research-memo-01
results_file: results/law-en-research-memo-01.yaml
