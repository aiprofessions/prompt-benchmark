id: law-fr-plan-recherche-01
lang: fr
translation_key: law-research-memo
title: Plan de recherche juridique, vice caché sur un véhicule d'occasion entre particuliers
scenario: À partir d’une note d’entretien anonymisée, préparez les questions à trancher, les sources à consulter, les mots-clés
  et les pièces à demander, sans préjuger de l’issue du litige.
profession: lawyers
task: lawyers.case-research
tools: []
model: chatgpt
tested_with: gpt-6-astra
tested_date: '2026-10-19'
jurisdictions:
- FR
prompt: 'Vous assistez un avocat en droit civil français. Préparez un plan de recherche à partir de la note anonymisée ci-dessous,
  sans rédiger de consultation ni conclure sur l’issue du litige.

  1. Questions juridiques à trancher : formulez 5 à 8 questions, sous forme interrogative.

  2. Sources à consulter : indiquez les types de sources utiles et au moins une base officielle, en précisant ce que vous
  y rechercherez. Ne citez aucune décision ni aucun numéro de pourvoi, même fourni dans la note.

  3. Mots-clés de recherche : proposez 10 à 15 mots-clés ou expressions, regroupés par question ou thème.

  4. Points de fait : listez les informations à éclaircir avec le client et les pièces à demander ; signalez toute incohérence
  sans la résoudre arbitrairement.

  Utilisez uniquement la note pour les faits ; vos connaissances générales servent seulement à orienter les recherches et
  à nommer les sources. N’inventez aucun fait, chiffre, date, délai, texte, décision, norme ou prix ; signalez les informations
  manquantes.

  Ne présentez aucune règle de droit comme établie. Toute mention d’un article de code doit être suivie de « à vérifier sur
  Légifrance ». Signalez toute référence du client comme à vérifier, sans en reproduire les éléments interdits ni en déduire
  une issue favorable.

  N’ajoutez aucun nom réel ni aucune donnée identifiante inutile. Ne donnez aucune garantie de résultat.

  Restez dans une limite de 600 mots. Terminez par une ligne rappelant que les faits, les sources et le plan doivent être
  vérifiés et validés par l’avocat en charge du dossier.

  Note d’entretien :

  [Collez la note d’entretien, les dates, montants et pièces disponibles ; remplacez les noms et retirez les coordonnées,
  immatriculations et autres identifiants réels]

  '
sample_input: 'Dossier entièrement fictif : Martin Exemple / Ana Exemplo. Note d’entretien du 12 octobre 2026.

  Client : Martin Exemple, particulier (martin.exemple@exemple.test).

  Vendeuse : Ana Exemplo, particulière, rencontrée via une petite annonce en ligne.

  Véhicule : berline diesel de 2017, 142 000 km au compteur selon l’annonce.

  Prix payé : 7 900,00 € par virement.

  Le client déclare avoir acheté le véhicule le 14 mars 2026.

  L’annonce indiquait « vendu en l’état, sans garantie ». Par SMS, avant la vente, la vendeuse a écrit : « jamais eu de souci
  moteur ».

  Un contrôle technique de moins de six mois a été remis lors de la vente. Le client ne sait plus s’il mentionnait des défauts.

  Le 2 septembre 2026, panne moteur sur autoroute. Le Garage Exemple Auto (fictif) évoque un joint de culasse « ancien, réparé
  à la va-vite ». Il a établi un devis de réparation de 4 300,00 € le 9 septembre 2026.

  Pièces fournies par le client : copie de l’annonce, capture des SMS, certificat de cession daté du 14/03/2025, devis du
  garage.

  Le client ajoute : « Mon beau-frère m’a dit qu’il existe un arrêt de la Cour de cassation, pourvoi n° 19-00.000, qui me
  donne forcément raison. »

  Cette référence est inventée pour les besoins du dossier fictif.

  Objectif du client : annuler la vente ou obtenir une réduction du prix, et se faire rembourser la réparation.

  '
