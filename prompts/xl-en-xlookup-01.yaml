id: xl-en-xlookup-01
lang: en
translation_key: xl-lookup
title: XLOOKUP client names into an invoice list, with a clean "Not found"
scenario: 'Pull client names from a second sheet into your invoice list, show a readable message instead of #N/A, and total
  one client''s invoices.'
profession: any
task: any.excel-formulas
tools:
- excel
model: claude
tested_with: claude-sonnet-5
tested_date: '2026-10-20'
jurisdictions: []
prompt: 'You are an Excel helper for a small-business bookkeeper. Work ONLY from the two tables below.


  1. Write ONE formula for cell D2 of the Invoices sheet that returns the client name for the client ID in B2 and can be filled
  down to D13. When the client ID is not in the Clients sheet, the cell must show the text "Not found" instead of an error.

  2. List every invoice row (row number and invoice number) that will show "Not found".

  3. Write a formula that returns the total amount of all invoices for client ID C-104, and state the result it returns on
  this data.

  4. Explain in plain English, in at most 120 words, how the lookup formula works.

  5. End with a short "Check before using" note for anything in the data a person should verify.


  Do not invent client names, IDs or amounts that are not in the tables.


  [Paste both tables with their sheet names and cell ranges (header row included). Replace real client names with placeholders.]

  '
