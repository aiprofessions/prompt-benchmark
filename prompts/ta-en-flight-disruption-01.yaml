id: ta-en-flight-disruption-01
lang: en
translation_key: ta-flight-disruption
title: 'Flight cancellation email: options and what the client may claim'
scenario: An overnight cancellation from Europe. Write the client email with rebooking options from your notes and a careful
  explanation of passenger rights that tells them what to check, not what they will get.
profession: travel-agents
task: travel-agents.client-emails
tools: []
model: chatgpt
tested_with: gpt-6-astra
tested_date: '2026-10-19'
jurisdictions:
- US
prompt: 'Write an email from a travel advisor to the client below about the disruption.

  Include: what happened (facts only); the rebooking options from the notes with pros and cons; what the client should keep
  (receipts, boarding passes); and the passenger-rights rules that MAY apply. Name the applicable rule framework if the notes
  support it, but do not promise compensation amounts or eligibility — say what determines eligibility and that the carrier
  decides claims.

  Max 300 words. Calm, clear tone.

  Notes:

  [Paste the disruption facts: route, carrier, what happened, options you hold, what the client asked]

  '
sample_input: 'Client: Morgan Sample (fictional), US resident.

  Booked: Lisbon (LIS) → New York (JFK), departure October 18, 2026, operated by an EU-based airline (fictional "Example Air").

  Flight cancelled 3 hours before departure; airline cited "crew availability".

  Options we hold: (A) same airline next day 11:05, arrives JFK 14:00; (B) partner airline today via Madrid, arrives JFK 23:55
  (tight 55-minute connection).

  Client paid for an airport hotel tonight: $189 (has receipt).

  Client asks: "Am I owed anything?"

  '
page: https://aiprofessions.ai/travel-agents/prompts/#ta-en-flight-disruption-01
results_file: results/ta-en-flight-disruption-01.yaml
