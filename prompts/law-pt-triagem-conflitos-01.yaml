prompt: 'Atue como assistente de triagem de um escritório de advocacia no Brasil. Prepare os itens abaixo para revisão por
  advogado.

  1. Resumo neutro do relato (máx. 120 palavras), sem tratar alegações como fatos comprovados.

  2. Lista para checagem de conflitos: todas as pessoas e empresas citadas, inclusive pessoas não identificadas pelo nome,
  com seus papéis relatados e vínculos a confirmar.

  3. Linha do tempo com todas as datas informadas, inclusive a do contato, e pontos que exigem avaliação urgente; distinga
  datas documentais, vencimentos informados e prazos alegados por terceiros.

  4. Documentos a pedir: pelo menos quatro tipos pertinentes ao caso, além das informações que faltam para a análise.

  5. Resposta à pessoa (máx. 150 palavras): agradeça, peça documentos e esclareça que ainda não há contratação nem representação
  e que a mensagem não constitui parecer jurídico; não proponha honorários sem dados.

  Use apenas os dados fornecidos; não invente fatos, valores, datas, normas ou jurisprudência, não afirme prazo legal nem
  confirme prazo de terceiro e sinalize incertezas.

  Não é necessário calcular valores; se fizer algum cálculo, mostre a operação e diferencie o resultado dos valores relatados,
  sem concluir que ele representa dívida exigível.

  Não reproduza termos ofensivos ou discriminatórios nem credenciais de acesso; se houver credenciais, oriente a pessoa a
  alterá-las e a não enviá-las novamente.

  Não dê parecer nem prometa resultado. Termine indicando o que o advogado deve verificar, inclusive conflitos, documentos
  e eventual urgência, antes de revisar e autorizar o envio.

  Mensagem recebida:

  [Cole a mensagem do potencial cliente; anonimize nomes, CPF, celular, endereço e dados bancários e remova senhas ou códigos
  de acesso]

  '
sample_input: 'Canal: WhatsApp do escritório (fictício), recebida em 19/10/2026 às 08:12.

  De: Ana Exemplo, celular (11) 90000-0000 (fictício), e-mail ana.exemplo@exemplo.test

  Indicação: Dra. Beatriz Exemplo (fictícia)


  "Bom dia! A Dra. Beatriz Exemplo me passou o contato de vocês. Em 03/03/2026 assinei com a Construtora Reforma Exemplo Ltda.
  (fictícia), do sr. João Exemplo, um contrato de reforma da cozinha e do banheiro do apartamento que é meu e do meu marido,
  Martin Exemplo. Valor total R$ 46.000,00. Paguei a entrada de R$ 18.400,00 em 03/03 e mais R$ 9.200,00 em 15/04, os dois
  por Pix.

  O mestre de obras, Carlos Exemplo, um baiano preguiçoso, parou de aparecer em 20/06 e desde então a obra está largada, o
  banheiro está sem piso e sem vaso.

  Agora a Casa Exemplo Materiais (fictícia) está me cobrando R$ 7.850,00 de materiais que a construtora comprou no meu cadastro.
  O boleto vence em 25/10/2026.

  E no dia 14/10 chegou uma carta do Banco Exemplo S.A. (fictício), datada de 09/10, sobre o empréstimo que fiz para pagar
  a reforma, falando de parcela em atraso. Não entendi direito.

  Minha vizinha disse que eu tenho só 5 dias para responder ao banco, senão perco o apartamento.

  Para adiantar, mando a senha do app do banco: Exemplo#2026 (fictícia), aí vocês olham o extrato.

  Quanto vocês cobram para resolver tudo isso?"

  '
