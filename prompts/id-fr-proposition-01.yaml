id: id-fr-proposition-01
lang: fr
translation_key: id-proposal
title: Proposition d’honoraires d’architecte d’intérieur pour la rénovation d’un appartement
scenario: Transformez des notes de rendez-vous en proposition d’honoraires par phase, avec calculs HT et TTC, exclusions et
  postes non chiffrés, sans garantie de délai ni de budget.
profession: interior-designers
task: interior-designers.client-proposals
tools: []
model: chatgpt
tested_with: gpt-6-astra
tested_date: '2026-10-19'
jurisdictions:
- FR
prompt: 'Vous êtes architecte d’intérieur en France. Rédigez une proposition d’honoraires adressée au client en le vouvoyant,
  suivie d’une note interne (650 mots maximum pour l’ensemble).

  1. Présentez l’objet de la mission : bien, surface et nature de la rénovation.

  2. Prévoyez une rubrique par phase indiquée dans les notes : contenu et montant HT, avec le calcul détaillé de toute part
  au pourcentage (taux × assiette).

  3. Présentez un tableau récapitulatif : chaque phase, total HT, TVA au taux indiqué et total TTC. Montants au format 1 234,56
  €.

  4. Distinguez « Ce qui n’est pas inclus » et « Ce qui n’est pas encore chiffré » en deux listes ; précisez le traitement
  des postes non chiffrés dans l’assiette actuelle et les modalités de recalcul prévues dans les notes.

  5. Ajoutez une note interne séparée signalant les incohérences, les demandes problématiques et les points à vérifier par
  l’architecte avant envoi.

  Utilisez uniquement les informations fournies et les calculs qui en découlent. Respectez l’assiette définie dans les notes.
  N’inventez ni montant, ni date, ni délai, ni norme, ni référence légale ; ne formulez aucune affirmation réglementaire.

  Ne garantissez ni délai de chantier ni budget de travaux. Pour toute information nécessaire mais manquante, indiquez « à
  compléter ». Présentez le document comme un projet à valider et signer par l’architecte d’intérieur.

  Notes :

  [Collez vos notes : phases, forfaits, pourcentage et assiette, estimation des travaux, TVA, exclusions et demandes du client.
  Anonymisez les noms, l’adresse et les coordonnées.]

  '
sample_input: 'Cas entièrement fictif : toutes les personnes, entreprises, coordonnées et données ci-dessous sont inventées.

  Cabinet : Atelier Exemple Intérieurs (fictif), SIREN fictif 000 000 000, contact@atelier-exemple.test

  Client : M. Martin Exemple, martin.exemple@client.test

  Bien : appartement de 85 m², 3e étage, 12 rue de l’Exemple, 69000 Lyon (adresse fictive), en copropriété.

  Projet : rénovation complète (cuisine ouverte sur séjour, salle d’eau refaite, revêtements de sol et peintures partout).


  Honoraires convenus au rendez-vous du 14/10 :

  - Esquisse (relevé, 2 propositions d’aménagement, planche d’ambiance) : forfait 1 800 € HT.

  - APD (plans cotés, choix des matériaux, consultation de 3 entreprises) : forfait 2 600 € HT.

  - Suivi de chantier (réunions hebdomadaires, comptes rendus, réception) : 8 % du montant HT des travaux estimé. Pourcentage
  recalculé en fin de chantier sur le montant HT réellement facturé par les entreprises.

  - TVA : 20 %.


  Estimation des travaux (entreprise Exemple Bâtiment, fictive) : 62 000 € HT, soit 74 400 € TTC.

  Remarque de mon assistante : « suivi = 8 % de 74 400, soit 5 952 € ».


  Non compris dans l’estimation, pas encore chiffré :

  - Cuisine sur mesure : devis du menuisier attendu.

  - Reprise de l’installation électrique : étendue à définir après diagnostic.


  Exclus de la mission : achat du mobilier et de la décoration, démarches auprès du syndic et de l’assemblée générale de copropriété,
  frais de reproduction des plans au-delà de 3 jeux.


  Demande du client (mail du 16/10) : « Pouvez-vous me garantir dans la proposition que tout sera fini avant le 15 décembre
  et que les travaux ne dépasseront pas 60 000 € ? »

  '
