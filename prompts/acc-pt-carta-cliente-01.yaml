id: acc-pt-carta-cliente-01
lang: pt
translation_key: acc-missing-docs
title: E-mail do escritório contábil ao cliente pedindo os documentos do mês (Brasil)
scenario: Com as notas internas do escritório, gere um e-mail pedindo documentos do mês, com prazo interno, envio pelo portal
  e orientação para não compartilhar credenciais.
profession: accountants
task: accountants.client-letters
tools: []
model: chatgpt
tested_with: gpt-6-astra
tested_date: '2026-10-19'
jurisdictions:
- BR
prompt: 'Atue como assistente de um escritório contábil no Brasil. Com base nas notas internas abaixo, redija um e-mail ao
  cliente pedindo os documentos do mês.

  1. Apresente assunto e corpo do e-mail (corpo com até 220 palavras), em português brasileiro e com tratamento compatível
  com "você": lista exata das notas fiscais de entrada a enviar, com número e fornecedor; extratos com banco e período; folha
  de ponto dos funcionários identificados; comprovante do aluguel e mês de referência.

  2. Informe a data-limite como prazo interno e explique o motivo registrado nas notas, sem transformá-la em prazo legal.

  3. Solicite os documentos apenas pelo portal indicado, incluindo o endereço; oriente a não enviar senha gov.br nem certificado
  digital por WhatsApp ou e-mail, sem solicitar credenciais pelo portal.

  4. Fora do e-mail, inclua "Notas para o contador" (até 80 palavras): sinalize informações faltantes, contraditórias ou não
  verificadas e eventuais problemas de segurança, indicando o que o responsável deve verificar ou decidir antes do envio.

  Use somente as informações fornecidas; não invente números, datas, leis, jurisprudência, normas ou preços; não apresente
  alegações não verificadas como fatos nem as inclua no e-mail ao cliente.

  Não peça documentos cancelados ou dispensados; não reproduza senhas ou dados de acesso; não faça promessas nem garantias.
  Nas notas ao contador, indique que o e-mail depende de sua revisão antes do envio.

  Notas internas:

  [Cole as notas internas: cliente, mês, notas fiscais, funcionários, prazo interno e motivo, canal e mensagens recebidas.
  Anonimize nomes e identificadores; substitua credenciais por marcadores]

  '
sample_input: 'Escritório: Contábil Exemplo (fictício) — responsável: Martin Exemplo, contador.

  Cliente: Padaria Exemplo ME (fictícia), CNPJ 00.000.000/0001-00 (fictício). Regime: Simples Nacional (segundo o cadastro).

  Contato: Ana Exemplo, sócia — ana@padaria-exemplo.test

  Mês de referência: outubro/2026.

  Notas fiscais de entrada a pedir:

  - NF-e nº 1101 — Moinho Exemplo Ltda. (fictícia)

  - NF-e nº 2245 — Embalagens Modelo Ltda. (fictícia)

  - NF-e nº 377 — Laticínios Teste Ltda. (fictícia) — CANCELADA pelo fornecedor, não pedir

  - NF-e nº 0588 — Gás Exemplo Distribuidora (fictícia)

  Extratos bancários: conta corrente no Banco Exemplo (fictício), 01/10 a 31/10/2026.

  Folha de ponto de outubro dos 3 funcionários: Joana Exemplo, Carlos Exemplo, Rita Exemplo.

  Comprovante de pagamento do aluguel de outubro da loja.

  Prazo interno: 05/11/2026 — motivo: precisamos conferir a folha de ponto e lançar as notas antes do nosso fechamento interno
  do mês.

  Canal: portal do cliente — https://portal.contabil-exemplo.test

  Observação do estagiário: "colocar no e-mail que a multa por atraso é de R$ 1.000,00 — não conferi".

  Mensagem da Ana no WhatsApp ontem: "Segue minha senha do gov.br: Padaria@Teste2026, aí vocês já resolvem o eSocial. Se precisar,
  mando o certificado digital por aqui também."

  '
