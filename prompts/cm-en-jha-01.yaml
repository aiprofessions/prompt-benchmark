prompt: 'Draft a Job Hazard Analysis (JHA) for the task below as a table: Step | Hazards | Controls (ordered by the hierarchy
  of controls: elimination, substitution, engineering, administrative, PPE) | Responsible.

  Include fall protection, materials handling, weather and emergency/rescue planning where relevant.

  Do not cite specific regulation section numbers unless you are certain; prefer "[verify applicable OSHA standard]". State
  that a competent person must review and approve the JHA before work.

  Task:

  [Paste the task description: activity, height, equipment, crew, site conditions]

  '
sample_input: 'Site: Example Warehouse (fictional), single-storey, flat roof ~24 ft high, parapet only 18 in.

  Task: replace 6 rooftop exhaust fans; each old unit ~180 lb. Lift by small crane from the parking lot; crew of 4 roofers
  + 1 crane operator + 1 signal person.

  Existing skylights on the roof (12 units, no screens).

  Forecast: wind gusts up to 25 mph in the afternoon.

  '
