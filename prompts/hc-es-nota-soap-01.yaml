id: hc-es-nota-soap-01
lang: es
translation_key: hc-soap-note
title: Nota de evolución SOAP a partir de una transcripción anonimizada (México)
scenario: Borrador de nota SOAP solo con lo dicho en la consulta, con faltantes señalados; el médico la revisa y firma. Solo
  texto anonimizado (sin nombre, CURP ni expediente).
profession: healthcare
task: healthcare.clinical-notes
tools: []
model: claude
tested_with: claude-opus-5-5
tested_date: '2026-10-19'
jurisdictions:
- MX
prompt: 'Redacta un borrador de nota de evolución en formato SOAP a partir de la transcripción anonimizada de una consulta
  de medicina general en México.

  Reglas:

  - Usa solo lo dicho en la transcripción; no agregues hallazgos, antecedentes ni diagnósticos no mencionados.

  - Registra signos vitales y la indicación de medicamentos exactamente como se dijeron.

  - Las alergias deben quedar en un lugar muy visible.

  - Termina con "Faltante / por confirmar": lo que la nota necesitaría y no está en la transcripción.

  - Indica que es un borrador que requiere revisión y firma del médico tratante (la nota es parte del expediente clínico).

  Transcripción:

  [Pega la transcripción o dictado ANONIMIZADO — sin nombre, CURP, número de expediente ni domicilio]

  '
sample_input: '[Anonimizada, ficticia] Paciente adulto de 34 años.

  Paciente: Dolor de garganta desde hace 3 días, me duele tragar, anoche tuve fiebre. No tengo tos. Mi hijo tuvo faringitis
  estreptocócica la semana pasada.

  Médico: ¿Alergias? Paciente: A la penicilina, me salieron ronchas de niño.

  Enfermería: Temp 38.4 °C, FC 96, TA 122/78, SpO2 99 % aire ambiente.

  Exploración (dicho por el médico): Amígdalas hipertróficas con exudado blanquecino. Sin exantema.

  Médico: Hacemos prueba rápida de estreptococo. Si sale positiva, usamos un antibiótico que no sea penicilina. Mientras tanto
  ibuprofeno 400 mg cada 6 horas si hay dolor, con alimentos. Regrese o llame si no puede tragar líquidos o le falta el aire.

  '
