id: re-pt-proposta-compra-01
lang: pt
translation_key: re-offer-review
title: Revisão de proposta de compra de imóvel antes de apresentar ao vendedor (Brasil)
scenario: 'Proposta recebida de um comprador: obtenha o resumo das condições, os cálculos conferidos, os riscos e ambiguidades,
  as perguntas ao comprador e o que o advogado precisa revisar.'
profession: real-estate-agents
task: real-estate-agents.contract-review
tools: []
model: chatgpt
tested_with: gpt-6-astra
tested_date: '2026-10-19'
jurisdictions:
- BR
prompt: 'Atue como um corretor de imóveis no Brasil e revise a proposta recebida antes de apresentá-la ao vendedor, sem dar
  parecer jurídico.

  1. Resuma as condições em até 150 palavras: preço, sinal/arras, parcelas, financiamento, prazo para escritura/contrato definitivo,
  responsáveis pelas despesas segundo a proposta, condições para a compra e posse.

  2. Confira os cálculos: valor e percentual de cada parcela, total de recursos próprios e saldo financiado; mostre a soma
  e eventual diferença em relação ao preço. Peça esclarecimento de divergências, sem decidir qual condição deve ser alterada.

  3. Liste os riscos e pontos ambíguos: compatibilidade dos prazos, condições sem prazo ou consequência definida, despesas
  não especificadas e afirmações sem comprovação.

  4. Faça perguntas objetivas ao comprador sobre as pendências identificadas, incluindo prazos e documentos necessários para
  verificar suas declarações.

  5. Indique os pontos que precisam de revisão por advogado antes da assinatura, incluindo sinal/arras e desistência; diga
  o que o corretor ainda precisa verificar.

  Use apenas os dados abaixo e os cálculos derivados deles; não invente valores, datas, taxas ou documentos. Não faça afirmações
  regulatórias nem cite leis, artigos, jurisprudência ou normas. Diferencie declarações de informações comprovadas e sinalize
  o que falta.

  Não garanta aprovação de crédito nem fechamento do negócio. Use valores no formato R$ 1.234,56. Limite total de 600 palavras;
  admite-se tolerância de 10% nos limites de palavras.

  Dados da proposta:

  [Cole o texto da proposta de compra e as observações do corretor; troque nomes, CPF, matrícula e endereço por dados fictícios]

  '
sample_input: 'PROPOSTA DE COMPRA (documento fictício para exemplo)

  Todos os nomes, endereços e identificadores abaixo são fictícios.

  Data: 12/10/2026. Validade da proposta: 5 dias corridos.

  Imóvel: apartamento, Rua Exemplo, 100, apto 42, Cidade Exemplo/SP, matrícula nº 00.000 (fictícia) do Cartório de Registro
  de Imóveis de Cidade Exemplo (fictício).

  Vendedor: Martin Exemple. Compradora: Ana Exemplo (e-mail ana@exemplo.test).

  Intermediação: Imobiliária Exemplo Ltda. (fictícia), CRECI J-00000 fictício.


  Condições oferecidas pela compradora:

  - Preço total: R$ 640.000,00.

  - Sinal e princípio de pagamento: 10% (R$ 64.000,00), via Pix, na assinatura do compromisso de compra e venda, "a título
  de arras".

  - Parcela intermediária: R$ 96.000,00 em até 60 dias da assinatura do compromisso, com recursos da venda do apartamento
  atual da compradora (Rua Modelo, 7, Cidade Exemplo, fictício). "Proposta condicionada à venda do imóvel atual da compradora."

  - Saldo: R$ 490.000,00 por financiamento bancário. "Crédito já aprovado."

  - Escritura / contrato definitivo: em até 30 dias da assinatura do compromisso.

  - ITBI e registro: por conta da compradora. "Demais despesas divididas entre as partes."

  - Desistência: "Se o vendedor desistir, devolve o sinal em dobro."

  - Posse: na entrega das chaves.

  - Débitos de condomínio e IPTU: o vendedor declara que estão "em dia".


  Observações do corretor (internas):

  - A compradora disse pelo WhatsApp que "o gerente do banco falou que está aprovado"; nenhuma carta de crédito ou documento
  do banco foi enviado.

  - O apartamento da compradora ainda não foi anunciado.

  - Nenhuma certidão de condomínio ou de IPTU foi apresentada até agora.

  '
page: https://aiprofessions.ai/pt/corretores-de-imoveis/prompts/#re-pt-proposta-compra-01
