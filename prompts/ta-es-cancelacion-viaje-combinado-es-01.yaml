id: ta-es-cancelacion-viaje-combinado-es-01
lang: es
translation_key: ta-supplier-terms
title: Cálculo de cancelación de un viaje combinado y resumen para el cliente (España)
scenario: 'Condiciones del organizador, fechas y pagos de un viaje combinado: calcula días de antelación, penalización y reembolso
  si el cliente cancela hoy, y redacta un resumen prudente para él.'
profession: travel-agents
task: travel-agents.supplier-terms
tools: []
model: chatgpt
tested_with: gpt-6-astra
tested_date: '2026-10-21'
jurisdictions:
- ES
prompt: 'Actúa como agente de viajes de una agencia minorista en España. Prepara la respuesta al cliente que quiere cancelar
  un viaje combinado con los datos de abajo.

  1. Muestra el cálculo paso a paso: antelación como diferencia entre la fecha de salida y la fecha de hoy, desglosada por
  meses, tramo aplicable, penalización, gastos de gestión, total retenido, pagos e importe a devolver o pendiente de pago.

  2. Contrasta las afirmaciones del cliente con los datos y aclara las discrepancias con respeto.

  3. Redacta un correo al cliente (máximo 250 palabras, tratamiento de usted) con una tabla breve de cifras, el derecho a
  pedir justificación del importe y las condiciones y el plazo de reembolso recogidos en la referencia normativa.

  4. Explica en el correo cómo se valorarán los hechos pendientes de confirmar y, si procede conforme a esa referencia, cuánto
  se devolvería en el supuesto de cancelación sin penalización, sin garantizar su aplicación.

  5. Añade notas internas (máximo 120 palabras) sobre lo que falta y lo que la agencia debe verificar; indica que una persona
  de la agencia debe revisar y aprobar el correo antes de enviarlo.

  Usa solo los datos y la referencia normativa facilitados; no inventes cifras, fechas, leyes, jurisprudencia, normas, precios
  ni condiciones. Señala la información que falte.

  Distingue el cálculo según las condiciones del organizador de los supuestos legales que deban verificarse. No prometas resultados.
  Expresa los importes en euros con formato 1.234,56 €.

  Datos:

  [Pega las condiciones del organizador, las fechas, el precio, los pagos, el mensaje del cliente y la referencia normativa
  verificada; anonimiza nombres, localizador y datos de contacto]

  '
sample_input: 'Caso íntegramente ficticio.

  Agencia minorista: Viajes Ejemplo S.L. (ficticia) – reservas@viajes-ejemplo.test

  Organizador: Muestra Tours Mayorista S.A. (ficticia)

  Localizador: EJ-0000-TEST

  Viajeros: Ana Exemplo y Martin Exemple (2 personas ficticias)

  Viaje combinado: Nápoles (Italia), vuelo de ida y vuelta + 7 noches de hotel en régimen de alojamiento y desayuno.

  Fecha de salida: jueves 19/11/2026.

  Fecha de hoy: miércoles 21/10/2026 (el cliente comunica hoy por correo que quiere cancelar).

  Precio total del viaje combinado: 2.480,00 € (1.240,00 € por persona).

  Pagos: depósito del 50 % = 1.240,00 €, pagado el 02/09/2026. Resto (1.240,00 €) vence el 04/11/2026; no pagado.


  Condiciones de cancelación (extracto del organizador):

  "El viajero podrá resolver el contrato en cualquier momento antes de la salida, abonando al organizador una penalización
  sobre el precio total del viaje combinado según la antelación con que comunique la cancelación (días naturales hasta la
  fecha de salida):

  - Más de 30 días: 15 %

  - Entre 30 y 15 días, ambos incluidos: 40 %

  - Menos de 15 días o no presentación: 100 %

  En todos los casos se añadirán gastos de gestión de 35,00 € por persona."


  Mensaje del cliente (Ana Exemplo):

  "Queremos cancelar. He contado y faltan 31 días para la salida, así que entiendo que solo nos quitarían el 15 %. Además,
  he leído que hay huelga en el aeropuerto de destino; ¿eso no nos libra de pagar nada?"


  Nota interna: no hemos confirmado ninguna huelga; el organizador no ha comunicado incidencias en el destino.


  Referencia normativa verificada para este ejercicio, España:

  Real Decreto Legislativo 1/2007 (TRLGDCU), artículo 160.

  - Art. 160.1: antes del inicio del viaje combinado, el viajero puede resolver el contrato; el organizador o el minorista
  pueden exigir una penalización adecuada y justificable. El contrato puede fijar una penalización tipo razonable según la
  antelación. El viajero que lo solicite tiene derecho a una justificación del importe.

  - Art. 160.2: si concurren circunstancias inevitables y extraordinarias en el destino o sus inmediaciones que afecten de
  forma significativa al viaje o al transporte, el viajero puede resolver sin penalización, con reembolso completo pero sin
  compensación adicional.

  - Art. 160.4: los reembolsos se hacen sin demora indebida y como máximo en 14 días naturales tras la terminación del contrato.

  '
