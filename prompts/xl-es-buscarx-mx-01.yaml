id: xl-es-buscarx-mx-01
lang: es
translation_key: xl-lookup
title: BUSCARX por RFC y total pendiente con IVA en Excel en español (México)
scenario: Busque el cliente por RFC con BUSCARX, sume lo pendiente de cobro de ese RFC y calcule el IVA, con fórmulas que
  funcionen en un Excel en español de México.
profession: any
task: any.excel-formulas
tools:
- excel
model: claude
tested_with: claude-opus-5-5
tested_date: '2026-10-20'
jurisdictions:
- MX
prompt: 'Eres un asistente de Excel para una pequeña empresa en México. Mi Excel está en español (México): los nombres de
  las funciones están en español, el separador de argumentos es la coma y el separador decimal es el punto.


  Con base SOLO en la tabla de abajo:

  1. Escribe una fórmula para la celda B3 de la hoja "Resumen" que devuelva el nombre del cliente cuyo RFC está en Resumen!B2;
  si el RFC no existe, debe mostrar "No encontrado".

  2. Escribe una fórmula para Resumen!B4 que sume el subtotal de las facturas con estado "Pendiente" del RFC de B2.

  3. Si en B2 está el RFC EJE020202BB2, indica qué devuelve B4, el IVA al 16 % sobre ese importe y el total con IVA.

  4. Explica en máximo 100 palabras cómo funciona la fórmula del punto 2.


  No inventes datos fiscales, retenciones ni tasas distintas del 16 % indicado.


  [Pegue la tabla de facturas con su rango (folio, RFC, cliente, subtotal, estado) e indique la configuración de su Excel.
  Use datos ficticios o anonimizados.]

  '
sample_input: 'Hoja "Facturas", rango A1:E7 (encabezados en la fila 1). Datos ficticios.

  Fila | A: Folio | B: RFC | C: Cliente | D: Subtotal (MXN) | E: Estado

  2 | F-2026-031 | EJE010101AA1 | Ejemplo Reformas SA de CV | 1850.00 | Pagada

  3 | F-2026-032 | EJE020202BB2 | Café Ejemplo SA de CV | 640.00 | Pendiente

  4 | F-2026-033 | EJE030303CC3 | Óptica Ejemplo SA de CV | 2275.50 | Pendiente

  5 | F-2026-034 | EJE020202BB2 | Café Ejemplo SA de CV | 1120.00 | Pendiente

  6 | F-2026-035 | EJE040404DD4 | Taller Ejemplo SA de CV | 980.00 | Pagada

  7 | F-2026-036 | EJE020202BB2 | Café Ejemplo SA de CV | 415.80 | Pagada


  Hoja "Resumen": B2 = RFC a consultar (lo escribe el usuario).

  '
