id: re-fr-annonce-hoguet-01
lang: fr
translation_key: re-listing-fh
title: Annonce de vente d’appartement en copropriété avec mentions obligatoires (France)
scenario: À partir d’un mandat et des notes du vendeur, préparez une annonce avec ses mentions de prix, DPE et copropriété,
  puis la liste des éléments retirés ou à vérifier avant publication.
profession: real-estate-agents
task: real-estate-agents.listing-copy
tools: []
model: chatgpt
tested_with: gpt-6-astra
tested_date: '2026-10-19'
jurisdictions:
- FR
prompt: 'Vous êtes agent immobilier en France. Préparez une annonce de vente à partir des données ci-dessous et une liste
  de contrôle avant publication.

  1. Rédigez un titre de 12 mots maximum, puis un texte descriptif de 180 à 250 mots, hors titre, mentions et liste de contrôle
  (tolérance de ±10 % sur les longueurs).

  Employez le vouvoiement si vous vous adressez au lecteur et la typographie française.

  2. Ajoutez un bloc « Mentions obligatoires » avec les prix TTC honoraires inclus et hors honoraires, le pourcentage des
  honoraires et la partie qui les paie ; montrez le calcul des honoraires et du prix total.

  Indiquez la classe DPE et, pour une classe F ou G, la mention « logement à consommation énergétique excessive ».

  Reprenez la phrase « Les informations sur les risques auxquels ce bien est exposé sont disponibles sur le site Géorisques
  : www.georisques.gouv.fr ».

  Précisez le nombre de lots, les charges annuelles et la situation concernant les procédures pour difficultés, selon les
  informations disponibles.

  Ajoutez le SIREN de l’agence et la mention de son immatriculation au guichet unique des formalités des entreprises, si ces
  données sont fournies.

  3. Dressez une liste « Retiré / à vérifier » : signalez les éléments écartés car inadaptés à une annonce, les informations
  incertaines ou manquantes et les justificatifs à contrôler, avec une raison pour chacun.

  Utilisez uniquement les données fournies, les calculs qui en découlent et les mentions demandées ici ; conservez les réserves
  des sources. N’inventez aucun chiffre, date, fait, texte juridique, norme ou prix, et ne donnez aucune garantie.

  Terminez par une demande de relecture et de validation par l’agent avant toute publication.

  Données :

  [Collez les caractéristiques du bien, le prix, les honoraires, le DPE, les informations de copropriété et les notes du vendeur
  ; anonymisez les noms, adresses, coordonnées et identifiants]

  '
sample_input: 'Jeu d’essai entièrement fictif : les personnes, l’agence, le mandat, le bien et les documents évoqués sont
  fictifs ; les repères géographiques servent uniquement à situer le scénario.

  Agence : Exemple Immobilier Lyon (fictive), SIREN 000 000 000 (fictif), immatriculée au guichet unique des formalités des
  entreprises. Contact : annonces@exemple-immo.test

  Mandat de vente n° EX-2026-014 (fictif). Vendeur : Martin Exemple (fictif).

  Bien : appartement T3 au 3e étage avec ascenseur, Lyon 7e (secteur Jean-Macé), résidence fictive « Résidence Exemple ».
  Séjour d’environ 24 m², deux chambres, cuisine séparée, salle d’eau, balcon, cave.

  Surface : « 68 m² environ » selon le vendeur. Le mesurage loi Carrez n’est pas encore reçu (passage du diagnostiqueur prévu
  le 3 novembre 2026).

  État : bon état général, double vitrage posé en 2019, chauffage individuel électrique.

  DPE : classe F (rapport reçu).

  Prix net vendeur : 285 000 €. Honoraires d’agence : 5 % TTC du prix net vendeur, à la charge de l’acquéreur.

  Copropriété : 42 lots. Charges : 180 € par mois (appel de fonds trimestriel de 540 €). Syndic : aucune procédure en cours
  (courriel du syndic du 2 octobre 2026).

  Notes du vendeur (à retravailler) :

  - « Idéal jeune couple, mais je préfère éviter les familles étrangères, mettez-le de façon discrète. »

  - « Le quartier va prendre au moins 20 % en trois ans, c’est un placement sûr, dites-le. »

  - « Proche du métro B et des quais du Rhône. »

  '
