id: id-es-ficha-materiales-mx-01
lang: es
translation_key: id-material-spec
title: Ficha de especificación de materiales para cocina y baño de un departamento (México)
scenario: A partir de tus notas de obra, obtén una tabla de materiales por espacio con las cantidades recalculadas y las características
  que aún debes confirmar con el fabricante.
profession: interior-designers
task: interior-designers.material-specs
tools: []
model: claude
tested_with: claude-opus-5-5
tested_date: '2026-10-21'
jurisdictions:
- MX
prompt: 'Actúa como diseñador de interiores en México. Con las notas de abajo, prepara una ficha de especificación de materiales
  para cocina y baño.

  1. Presenta una tabla con columnas: Espacio | Elemento | Producto (tal como se anotó) | Característica a confirmar con el
  fabricante | Estado (Listo / Pendiente / Conflicto).

  2. Para cada superficie con medidas suficientes, calcula el área neta = largo × ancho y añade la merma indicada; muestra
  las operaciones y expresa en m² la diferencia respecto de la cantidad anotada, si existe. Marca como Conflicto cualquier
  discrepancia.

  Si falta la merma, calcula solo el área neta e indica que falta definirla; si faltan medidas, no calcules el área.

  3. Enumera las incompatibilidades o dudas de uso que se desprendan de las notas y refléjalas en el estado de cada elemento,
  sin aprobar usos cuya idoneidad no esté confirmada.

  4. Enumera los datos que el diseñador debe completar y las verificaciones pendientes antes de enviar la ficha.

  Usa solo las notas y los cálculos derivados de ellas. No inventes datos, clasificaciones técnicas, fechas, normas, leyes,
  marcas, productos de protección ni precios.

  Para cada característica técnica necesaria que no esté documentada, escribe «solicitar ficha técnica al fabricante»; distingue
  los datos anotados de los verificados y los deseos del cliente de las prestaciones acreditadas.

  La ficha es preliminar: deja su revisión, validación y firma al diseñador responsable.

  Notas del diseñador:

  [Pega tus notas de materiales por espacio: producto tal como lo anotaste, medidas, merma y observaciones. Anonimiza el nombre
  del cliente y la dirección]

  '
sample_input: 'Ejemplo enteramente ficticio: proyecto, personas, estudio y productos.

  Proyecto: Departamento Exemplo 302, Ciudad de México. Cliente: Martin Exemple.

  Diseñadora: Ana Exemplo, Estudio Muestra, ana@estudiomuestra.test

  COCINA

  - Piso: Porcelanato Ejemplo Gris Humo 60×60 (ficticio). Medidas: 3.20 m × 2.50 m. Merma: 10 %. Cantidad a pedir: 12.50 m².
  Caja dice "PEI 4".

  - Cubierta junto a la tarja: madera maciza de parota, 2.40 m lineales, 0.60 m de fondo. Acabado: "natural, se ve increíble".

  - Salpicadero: Azulejo Muestra Verde Olivo 7.5×15 (ficticio). Cantidad: pendiente medir.

  BAÑO

  - Piso de la regadera: Mosaico Exemplo Blanco Brillo 10×10 (ficticio). En la caja dice "solo para muros". Medidas: 0.90
  m × 1.20 m. Merma: 15 %.

  - Muros de la regadera: mismo mosaico, forrar hasta 2.10 m de altura. Medidas de muros: pendiente.

  - Mueble de lavabo: MDF laqueado (ficticio), sin especificar acabado del canto.

  Nota: el cliente quiere "algo que no se manche y que no resbale".

  '
