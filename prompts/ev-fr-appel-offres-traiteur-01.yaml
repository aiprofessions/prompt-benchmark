id: ev-fr-appel-offres-traiteur-01
lang: fr
translation_key: ev-catering-rfp
title: Demande de devis à trois traiteurs pour un séminaire, avec grille comparative
scenario: 'Effectifs, régimes, horaires et accès au lieu : préparez une demande de devis commune à trois traiteurs, une grille
  de réponse comparable et les points à vérifier.'
profession: event-planners
task: event-planners.vendor-rfp
tools: []
model: chatgpt
tested_with: gpt-6-astra
tested_date: '2026-10-19'
jurisdictions:
- FR
prompt: 'Vous êtes responsable de production événementielle en France. À partir des informations ci-dessous, préparez une
  demande de devis commune aux trois traiteurs consultés.

  1. Rédigez un e-mail d''envoi court (120 mots maximum, vouvoiement) rappelant la date limite de réponse.

  2. Rédigez le cahier des charges (500 mots maximum) : contexte, dates et horaires, effectifs par service et par régime,
  cumuls sur l''événement avec calculs détaillés, accès, contraintes logistiques et conditions d''annulation à demander.

  3. Traitez les allergies comme une exigence de sécurité : demandez une préparation excluant l''allergène, les mesures de
  prévention des contaminations croisées, l''identification des plats adaptés et un engagement écrit du traiteur sur ces dispositions,
  sans promettre l''absence de risque.

  4. Fournissez une grille de réponse comparable, commune aux trois traiteurs ; laissez les cellules de prix et de conditions
  vides ou indiquez « à compléter ».

  5. Ajoutez une liste « À vérifier avant envoi » : erreurs ou incohérences des données, informations manquantes, points à
  corriger ou à faire valider.

  Utilisez uniquement les données fournies ; recalculez les totaux et signalez les écarts. N''inventez aucun chiffre, prix,
  budget, pourcentage ni date ; indiquez « à préciser » pour les informations manquantes. Ne formulez aucune affirmation réglementaire
  et ne citez aucune loi, jurisprudence ni norme.

  Ne mentionnez aucune donnée nominative de santé. Indiquez que l''organisateur doit relire et valider les documents avant
  tout envoi.

  Données :

  [Collez le brief : dates, horaires, effectifs, régimes et allergies sans noms associés, accès, date limite et traiteurs
  consultés ; anonymisez les coordonnées]

  '
sample_input: 'Toutes les entités, personnes et coordonnées ci-dessous sont fictives.

  Client : Exemple Industries SAS (fictive), SIREN fictif 000 000 000.

  Organisateur : Exemple Conseil (fictive), contact Martin Exemple, martin.exemple@exemple-conseil.test.

  Événement : séminaire de la direction commerciale, jeudi 12 et vendredi 13 novembre 2026.

  Lieu : Domaine de l''Exemple (fictif), salle « Orangerie », 1er étage.

  Effectif : 45 participants + 3 intervenants = 48 personnes, présentes les deux jours (mêmes personnes).

  Services souhaités :

  - accueil café 8 h 30 – 9 h 00 (jeudi et vendredi)

  - déjeuner assis 12 h 30 – 13 h 45, entrée-plat-dessert (jeudi et vendredi)

  - pause après-midi 15 h 30 – 15 h 45 (jeudi uniquement)

  Total déjeuners indiqué dans le brief client : 86.

  Régimes (personnes distinctes, identiques les deux jours) : 6 végétariens, 2 sans gluten, 1 participante allergique aux
  fruits à coque.

  Note interne du client : « Pour l''allergie, ce n''est pas grave, quelques traces ça passe, inutile d''insister auprès du
  traiteur. »

  Accès : livraison uniquement par l''entrée de service, 2 rue de l''Exemple ; quai disponible de 7 h 00 à 8 h 15 ; pas de
  stationnement après 8 h 15 ; monte-charge (dimensions à confirmer). Office de réchauffe, aucune cuisson sur place.

  Vaisselle, nappage et personnel de service : à fournir par le traiteur.

  Budget : non communiqué (en attente de validation par la direction).

  Date limite de réponse des traiteurs : vendredi 30 octobre 2026 à 12 h 00.

  Traiteurs consultés (fictifs) : Traiteur Exemple A (contact@traiteur-a.test), Maison Exemple B (devis@maison-b.test), Exemple
  Réceptions C (bonjour@receptions-c.test).

  Conditions d''annulation : le client souhaite connaître les conditions de chaque traiteur (délais et montants retenus).

  '
