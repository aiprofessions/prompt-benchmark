prompt: 'Vous êtes collaborateur paie d''un cabinet d''expertise comptable en France. Préparez une relance à partir des seules
  notes ci-dessous.

  1. Rédigez un e-mail avec objet, en vouvoiement, au ton cordial et ferme, dont le corps ne dépasse pas 180 mots, pour préparer
  les bulletins et la DSN mensuelle.

  2. Présentez à puces les éléments attendus, avec le salarié et les précisions nécessaires. Ne redemandez pas les éléments
  déjà reçus, sauf redépôt sécurisé expressément prévu dans les notes.

  3. Reprenez la date limite interne et demandez le dépôt sur le portail sécurisé du cabinet. Distinguez les pièces manquantes
  des pièces à redéposer.

  4. Rappelez de ne transmettre aucune pièce d''identité, aucun RIB ni aucun numéro de sécurité sociale par e-mail non sécurisé
  ou messagerie instantanée.

  5. Ajoutez après l''e-mail une note interne « À vérifier avant envoi », de 5 puces maximum : informations absentes ou contradictoires,
  données sensibles reçues par un canal non sécurisé et affirmations non vérifiées, avec les suites à donner.

  N''inventez aucun chiffre, date, texte de loi, jurisprudence, norme ou tarif. N''ajoutez aucune affirmation réglementaire,
  échéance légale de DSN ou pénalité URSSAF ; signalez seulement en interne les demandes non vérifiées sur ces sujets, sans
  les reprendre dans l''e-mail.

  Ne reproduisez aucune donnée bancaire, aucun numéro de sécurité sociale ni aucun identifiant de connexion. Si une information
  indispensable à la rédaction manque, indiquez [à compléter] ; demandez au client les éléments de paie manquants.

  Indiquez dans la note interne que l''expert-comptable doit relire et valider l''e-mail avant envoi.

  Notes du dossier :

  [Collez les notes du dossier : mois de paie, éléments reçus et manquants, date limite interne et canal sécurisé. Anonymisez
  les noms et retirez les identifiants et données bancaires.]

  '
sample_input: 'Dossier entièrement fictif.

  Cabinet : Exemple Conseil & Associés (fictif) — collaboratrice paie : Ana Exemplo.

  Client : Boulangerie Exemple SARL (fictive) — gérant : M. Martin Exemple — 4 salariés.

  Paie concernée : octobre 2026.

  Reçu le 14/10 : planning d''octobre et congés payés de Julie Exemple (du 05/10 au 09/10).

  Éléments manquants :

  - Heures supplémentaires de Lucas Exemple : nombre d''heures et semaines concernées (le gérant a seulement dit « quelques
  heures »).

  - Absence de Nadia Exemplo : avis d''arrêt de travail et dates exactes (absente « depuis le 13/10 environ »).

  - Entrée de Hugo Exemple (vendeur, embauché le 12/10/2026) : contrat signé, pièce d''identité, carte Vitale ou attestation
  de droits.

  - Note de frais de Julie Exemple : justificatifs du déplacement au salon du 16/10, montant annoncé de 86,40 € sans justificatif.

  Pièce reçue par un canal non sécurisé : le 15/10, M. Exemple a envoyé à Ana une photo du RIB de Hugo par messagerie instantanée.
  Les données bancaires ne sont pas reproduites ici. Demander son redépôt sur le portail sécurisé, sans le présenter comme
  non reçu.

  Le gérant propose d''envoyer aussi la carte d''identité de Hugo « pareil, par messagerie ou par mail, c''est plus simple
  ».

  Date limite interne pour recevoir les éléments : jeudi 22/10/2026 à 12 h.

  Canal : espace client sécurisé du cabinet (le gérant a déjà ses accès).

  Post-it de l''ancien collaborateur : « Ajouter une échéance légale de DSN et une pénalité URSSAF dans la relance ? Aucune
  source vérifiée au dossier. »

  '
