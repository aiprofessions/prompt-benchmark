id: sm-en-cold-email-01
lang: en
translation_key: sm-cold-email
title: Three-touch cold email sequence grounded in your account notes
scenario: Account research in, a three-email sequence out — every claim traceable to your notes, no fabricated customer results,
  and a clean opt-out.
profession: sales-managers
task: sales-managers.outreach
tools: []
model: chatgpt
tested_with: gpt-6-astra
tested_date: '2026-10-19'
jurisdictions:
- US
prompt: 'Write a 3-email outbound sequence (day 1, day 4, day 10) to the prospect below.

  Each email: subject line (max 6 words) and body (max 110 words). One clear ask per email.

  Rules: use only the facts and proof points in the notes — do not invent statistics, customer names or results. Personalize
  from the notes. Include a simple opt-out line in each email. No fake urgency.

  Notes:

  [Paste your product one-liner, the prospect''s role and company notes, and proof points you are allowed to use]

  '
sample_input: 'Our product: Example Routing (fictional) — route-planning software for last-mile delivery fleets.

  Approved proof point: "Customers typically cut planning time from hours to minutes" (no % figures approved).

  Prospect: Avery Sample, VP Operations, Sample Fresh Foods (fictional), 60 delivery vans in 2 metro areas.

  Trigger: they announced expansion to a third metro in Q1 2027 (company press release).

  Avery spoke on a panel about driver retention last month.

  '
page: https://aiprofessions.ai/sales-managers/prompts/#sm-en-cold-email-01
results_file: results/sm-en-cold-email-01.yaml
