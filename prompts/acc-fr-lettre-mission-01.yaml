title: Projet de lettre de mission d’expertise comptable à partir des notes d’entretien
scenario: 'Notes d’entretien avec le gérant d’une SARL fictive : préparez une lettre de mission avec son périmètre, ses honoraires
  et son calendrier, puis les points à arbitrer avant envoi.'
