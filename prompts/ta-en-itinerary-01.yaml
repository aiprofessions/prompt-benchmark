id: ta-en-itinerary-01
lang: en
translation_key: ta-itinerary
title: Day-by-day itinerary draft that respects client constraints
scenario: Client profile in, a realistic day-by-day draft out — mobility and diet constraints honoured, logistics marked to
  confirm, and no invented prices or opening hours.
profession: travel-agents
task: travel-agents.itineraries
tools: []
model: claude
tested_with: claude-sonnet-5
tested_date: '2026-10-19'
jurisdictions:
- US
prompt: 'Draft a day-by-day itinerary from the client brief below.

  Rules:

  - Respect every stated constraint (mobility, diet, pace).

  - Keep travel days realistic; include the intercity transfer day.

  - Do not state prices, opening hours, train times or ticket rules as fact — mark them [confirm].

  - End with a "To book / to confirm" checklist and a note on travel insurance and entry requirements to check with official
  sources.

  Brief:

  [Paste the client brief: dates, cities, travellers, budget level, interests, mobility, diet]

  '
sample_input: 'Travellers: a retired couple (fictional "the Examples"), both 70+.

  Trip: Lisbon 3 nights then Porto 3 nights, May 5–11, 2027 (fly in to Lisbon May 5, fly out of Porto May 11).

  Mobility: one traveller uses a cane — avoid steep walking where possible, prefer taxis/tram, max ~3 hours of walking per
  day.

  Diet: pescatarian.

  Interests: tiles and history, food, one wine experience, no nightlife.

  Budget: comfortable, not luxury.

  '
page: https://aiprofessions.ai/travel-agents/prompts/#ta-en-itinerary-01
results_file: results/ta-en-itinerary-01.yaml
