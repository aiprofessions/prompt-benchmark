id: hc-fr-fiche-patient-01
lang: fr
translation_key: hc-patient-handout
title: Fiche patient en langage simple à partir des consignes du soignant
scenario: Transformez les consignes du soignant en une fiche patient courte, sans ajout médical. Une note séparée signale
  les informations manquantes et les éléments à vérifier avant remise au patient.
profession: healthcare
task: healthcare.patient-education
tools: []
model: claude
tested_with: claude-opus-5-5
tested_date: '2026-10-19'
jurisdictions:
- FR
prompt: 'Vous rédigez en français une fiche d''éducation du patient à partir des seules données ci-dessous.

  1. Fiche patient (250 mots maximum) : donnez un titre, utilisez le vouvoiement, des phrases courtes et des listes, dans
  un langage de niveau collège.

  Reprenez toutes les consignes à transmettre : gestes, surveillance, traitement, seuils, délais et contacts, sans modifier
  leur sens.

  2. Regroupez les signes d''alerte et les démarches associées sous « Quand appeler le 15 / qui contacter », uniquement si
  ces éléments sont fournis.

  3. Terminez la fiche par « À relire par votre soignant ».

  4. Ajoutez une note séparée « Points à vérifier par le soignant » (80 mots maximum) : informations manquantes, incohérences
  et éléments écartés.

  Conservez les consignes exploitables ; écartez de la fiche les ajouts non validés et signalez-les dans la note, sans proposer
  de correction médicale.

  Ne transmettez dans la fiche ni remarques internes ni jugements sur le patient.

  N''inventez aucun médicament, posologie, conseil, chiffre, date, texte juridique, jurisprudence, norme ou prix ; ne promettez
  aucun résultat.

  La note doit rappeler que le soignant doit vérifier les points signalés et valider la fiche avant toute remise au patient.

  Consignes du soignant et notes éventuelles, anonymisées :

  [Collez les consignes du soignant et les éventuelles notes internes, en supprimant les noms réels, le NIR, la date de naissance
  et les coordonnées personnelles]

  '
sample_input: 'Cas entièrement fictif : les personnes, le cabinet et les coordonnées ci-dessous sont fictifs.

  Cabinet infirmier Exemple. Consignes de sortie rédigées par l''infirmière Ana Exemplo.

  Patiente : Mme Martin Exemple, 58 ans, diabète de type 2. Insuline basale débutée cette semaine par le médecin traitant.

  Consignes à transmettre :

  - Glycémie capillaire 2 fois par jour : le matin à jeun et 2 h après le dîner, pendant 3 semaines. Noter chaque résultat
  dans le carnet.

  - Avant la piqûre au bout du doigt : se laver les mains à l''eau et au savon, bien sécher. Changer de doigt à chaque fois.

  - Insuline : dose selon l''ordonnance, ne pas la modifier seule.

  - Hypoglycémie si glycémie < 0,70 g/L : prendre 3 morceaux de sucre, recontrôler 15 minutes après. Si toujours < 0,70 g/L,
  reprendre 3 morceaux de sucre.

  - Si glycémie > 2,50 g/L deux fois de suite : appeler le cabinet infirmier au 01 00 00 00 00 (numéro fictif).

  - Consulter le médecin traitant dans la semaine si plus de 3 résultats > 2,50 g/L sur 7 jours.

  - Appeler le 15 si : malaise avec sueurs et confusion qui ne passe pas après le sucre, perte de connaissance (l''entourage
  appelle), impossibilité d''avaler.

  - Prochain rendez-vous infirmier : à fixer.

  Ajout de transcription non validé : « 0,70 g/L, soit 70 mmol/L ».

  Note interne (ne pas transmettre) : « patiente peu compliante, comprend mal, famille envahissante ».

  '
