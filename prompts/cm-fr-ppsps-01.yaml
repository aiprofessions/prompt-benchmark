id: cm-fr-ppsps-01
lang: fr
translation_key: cm-jha
title: Trame d’analyse des risques pour la partie travaux d’un PPSPS de gros œuvre
scenario: Préparez un tableau des risques et des mesures de prévention pour un chantier de gros œuvre, avec les risques majeurs
  et les points à vérifier avant transmission au coordonnateur SPS.
profession: construction-managers
task: construction-managers.safety-plans
tools: []
model: claude
tested_with: claude-opus-5-5
tested_date: '2026-10-19'
jurisdictions:
- FR
prompt: 'Vous êtes préventeur dans une entreprise de gros œuvre en France. Préparez une trame d’analyse des risques pour la
  partie « travaux » du PPSPS, en 400 mots maximum hors tableau.

  1. Présentez un tableau Tâche | Danger | Mesure de prévention | Responsable, avec au moins une ligne par tâche ; choisissez
  les responsables parmi les personnes ou fonctions citées.

  2. Dans « Risques majeurs », identifiez le travail en hauteur et la coactivité liée à la grue, avec les hauteurs, créneaux
  et zones connus ; précisez les chevauchements et calculez leur durée.

  3. Dans « Points à vérifier », relevez les affirmations non vérifiées, les incohérences de planning et les informations
  manquantes, marquées « à compléter ».

  4. Concluez par la transmission au coordonnateur SPS pour intégration au PGCSPS et par la nécessité d’une validation par
  l’encadrement compétent avant diffusion.

  Appuyez les constats uniquement sur les données fournies ; proposez des mesures de prévention adaptées, notamment contre
  les chutes, en les distinguant des dispositions déjà confirmées.

  N’inventez ni chiffre, ni date, ni prix, ni référence juridique, ni norme, ni valeur réglementaire ; les calculs issus des
  données sont autorisés.

  Ne validez pas les affirmations réglementaires non vérifiées des données et ne leur substituez pas de règle inventée.

  Le seul fait réglementaire à reprendre est le suivant : chaque entreprise intervenante participe à la coordination SPS en
  établissant son PPSPS, transmis au coordonnateur SPS pour intégration au PGCSPS.

  Indiquez ce que l’encadrement doit encore vérifier, notamment les mesures proposées ; ne garantissez ni la conformité ni
  la sécurité du chantier.

  Données du chantier :

  [Collez les tâches, le planning, les zones, les intervenants par fonction et les consignes du chantier ; anonymisez les
  noms, adresses et identifiants]

  '
sample_input: 'Cas entièrement fictif : toutes les entreprises, personnes et données ci-dessous sont fictives.

  Entreprise : Gros Œuvre Exemple SAS (fictive), SIREN fictif 000 000 000 – contact : prevention@gros-oeuvre-exemple.test

  Chantier : Résidence Exemple (fictive), bâtiment B, R+3, lot gros œuvre.

  Coordonnateur SPS : nom et coordonnées à compléter.

  Intervenants :

  - Conducteur de travaux : Martin Exemple

  - Chef de chantier : Ana Exemplo

  - Grutier (grue à tour du chantier) : Léo Exemple

  - Chef d’équipe sciage, sous-traitant Sciage Exemple SARL (fictive) : Paul Exemple

  Tâches de la semaine 43 :

  1. Coffrage d’un voile en hauteur : réglage et serrage des banches en tête de voile, plancher de travail à 4 m de hauteur,
  équipe de 3 compagnons.

  2. Manutention des banches à la grue : élingage au sol, levage et pose sur le voile, zone B. Poids des banches : à compléter.

  3. Découpe de béton : sciage d’une réservation au pied d’un voile existant, zone B, scie murale, production de poussières
  et de bruit.

  Planning :

  - Mardi 8 h – 12 h : manutention des banches à la grue, zone B.

  - Mardi 9 h – 11 h : découpe de béton au pied du voile, zone B (Sciage Exemple).

  Note non vérifiée du chef de chantier : « Pas besoin de garde-corps ni de harnais pour le coffrage du voile : à 4 m on reste
  sous le seuil réglementaire, et l’intervention dure moins d’une heure. »

  '
