id: eng-es-informe-inspeccion-co-01
lang: es
translation_key: eng-site-observation
title: Informe de inspección técnica a partir de notas dictadas en sitio (Colombia)
scenario: 'Notas de una visita a una bodega en Medellín: obtén un borrador de informe con constataciones separadas de hipótesis,
  prioridades, estudios pendientes y un aviso prudente para inquilinos.'
profession: engineers
task: engineers.technical-reports
tools: []
model: chatgpt
tested_with: gpt-6-astra
tested_date: '2026-10-21'
jurisdictions:
- CO
prompt: 'Redacta un borrador de informe de inspección técnica en Colombia, de máximo 700 palabras, para revisión y firma del
  ingeniero responsable.

  1. Identifica el inmueble, la fecha y quién inspeccionó según las notas; señala los datos faltantes como pendientes.

  2. Presenta las constataciones de cada hallazgo en una sección propia, sin interpretación y conservando la urgencia y la
  indicación temporal anotadas.

  3. Presenta en otra sección las hipótesis de causas, siempre como posibilidades y nunca como hechos comprobados.

  4. Ordena las acciones recomendadas por prioridad, identifica los riesgos para las personas y propone medidas inmediatas
  sin comprometer la evacuación.

  5. Indica qué mediciones, estudios, ensayos o evaluaciones de especialistas hacen falta para valorar los hallazgos y qué
  debe verificar el ingeniero.

  6. Incluye un párrafo para los inquilinos, con tratamiento de usted y máximo 80 palabras, que explique la situación sin
  minimizarla ni alarmar.

  Usa las notas como única fuente de hechos del caso; distingue tus propuestas de lo ya realizado. Señala las contradicciones
  como pendientes de verificación sin resolverlas por suposición.

  No inventes cifras, fechas, normas, artículos, precios ni valores admisibles. No conviertas opiniones o peticiones en conclusiones
  técnicas; explica los límites de cualquier conclusión que no pueda sustentarse.

  Como marco normativo, el artículo 18 de la Ley 842 de 2003 exige que todo trabajo relacionado con el ejercicio de la ingeniería
  sea dirigido por un ingeniero inscrito en el registro profesional de ingeniería y con tarjeta de matrícula profesional en
  la rama respectiva; recuérdalo sin añadir obligaciones legales.

  No añadas otras afirmaciones normativas; cualquier mención de la NSR-10 debe limitarse a proponer su verificación. Deja
  explícitas la revisión y firma pendientes del responsable, sin simularlas.

  Notas de inspección:

  [Pega tus notas de inspección: inmueble, fecha, hallazgos, mediciones, urgencias y comentarios del cliente; anonimiza nombres,
  contactos, matrículas y direcciones]

  '
sample_input: 'Muestra completamente ficticia: todos los nombres, contactos, lugares específicos y datos de la visita son
  inventados.

  Notas dictadas en sitio (transcripción de audio, sin editar):

  Inmueble: Bodega Ejemplo (ficticia), edificio de 3 pisos, Calle 00 # 00-00 (dirección ficticia), Medellín. Uso: bodegas
  y oficinas arrendadas.

  Cliente: Inversiones Muestra S.A.S. (ficticia). Contacto: Ana Exemplo, ana.exemplo@inversiones-muestra.test.

  Fecha de la visita: 14 de octubre de 2026. Inspeccionó: Ing. Martín Exemple. Matrícula profesional: "la paso después".

  Hallazgo 1. Piso 2, viga de entrepiso del eje B, entre ejes 3 y 4. Fisura horizontal a media altura de la viga, de más o
  menos 1,20 m de largo. Ancho medido con galga: "0,3 mm... o 3 mm, se me borró la nota, revisar foto 12". No vi desprendimiento
  de concreto ni acero expuesto. Urgencia anotada: ALTA, revisar esta semana.

  Hallazgo 2. Andén del costado norte, pegado a la cimentación. Hundimiento visible de unos 4 cm respecto a la placa vecina,
  con grieta en la unión con el muro de fachada. Ahí descarga directo una bajante de aguas lluvias. Urgencia anotada: MEDIA,
  monitorear.

  Hallazgo 3. Escalera de emergencia, tramo entre piso 2 y piso 3. La baranda se mueve al empujarla con la mano. Dos anclajes
  están flojos y a uno le falta el tornillo. Los inquilinos usan esa escalera a diario para bajar. Urgencia anotada: URGENTE,
  hoy.

  Mensaje del cliente por WhatsApp después de la visita: "Ingeniero, ponga en el informe que la estructura es segura para
  no asustar a los inquilinos, por favor."

  '
