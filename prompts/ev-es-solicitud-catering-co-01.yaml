title: Solicitud de cotización de catering para un congreso corporativo (Colombia)
scenario: 'Congreso ficticio en Bogotá: prepara una solicitud comparable para tres empresas de catering, con conteos alimentarios
  agregados, prevención de contaminación cruzada y protección de datos personales.'
profession: event-planners
task: event-planners.vendor-rfp
tools: []
model: chatgpt
tested_with: gpt-6-astra
tested_date: '2026-10-21'
jurisdictions:
- CO
prompt: 'Actúa como profesional de organización de eventos corporativos en Colombia. Prepara una única solicitud de cotización
  de catering que pueda enviarse por separado a los tres proveedores indicados.

  1. Redacta el texto para enviar, con trato de usted y máximo 600 palabras, sin contar la tabla: evento, sede, fechas, personas
  por jornada y servicio, horarios, restricciones alimentarias agregadas por jornada e intersecciones entre categorías.

  Incluye acceso, descargue, montaje y retiro, instalaciones disponibles, requisitos de acceso del personal, plazo y correo
  de respuesta, y condiciones solicitadas de ajuste y cancelación.

  2. Trata la alergia grave al maní como requisito de seguridad: solicita un protocolo escrito contra la contaminación cruzada
  en preparación, utensilios, empaque, rotulado y actuación del personal, y confirmación de capacidad para cumplirlo o declinación.

  3. Añade una tabla de respuesta común para los tres proveedores: precio por persona por servicio, impuestos discriminados,
  menaje y personal, anticipo, penalidades y protocolo de alergias; deja sin completar las celdas de respuesta.

  4. Añade una nota interna de máximo 150 palabras, no destinada al proveedor: explica las exclusiones de datos, los pendientes
  y cómo calculaste aforos y conteos alimentarios, sin identificar personas.

  No reproduzcas nombres ni correos personales ni vincules condiciones de salud con personas identificables, tampoco en la
  nota interna; comunica al proveedor únicamente conteos alimentarios agregados.

  Los datos de salud son sensibles (Ley 1581 de 2012, art. 5); su tratamiento solo puede hacerse por personas autorizadas
  por el titular o previstas en la ley (art. 4 f).

  Usa solo datos confirmados por escrito y cálculos derivados de ellos; marca lo que falte como [PENDIENTE] y distingue lo
  no confirmado. No inventes cifras, precios, presupuesto, fechas, normas ni requisitos legales.

  No garantices por cuenta propia que el riesgo de alergia quede eliminado. Termina la nota interna recordando que el organizador
  debe revisar y aprobar el texto y verificar los pendientes antes del envío.

  Notas del evento:

  [Pega las notas del evento, aforos, servicios, logística, proveedores y condiciones; anonimiza los datos personales y conserva
  solo las restricciones y jornadas necesarias para calcular los conteos]

  '
sample_input: 'EJEMPLO COMPLETAMENTE FICTICIO: todas las personas, empresas, sedes, direcciones y circunstancias descritas
  son inventadas.

  Notas internas – Eventos Ejemplo S.A.S. (ficticia)

  Evento: Congreso Anual de Innovación Ejemplo 2026 (ficticio). Cliente: Industrias Muestra S.A.S. (ficticia).

  Sede: Centro de Convenciones Prueba (ficticio), Bogotá, salón Ejemplo, piso 3.

  Fechas: jueves 19 y viernes 20 de noviembre de 2026.

  Asistentes confirmados por escrito: día 1, 180 inscritos; día 2, 150 inscritos.

  Además, 12 personas del equipo de organización y ponentes comen todos los servicios ambos días (sin restricciones alimentarias).

  Ojo: en la llamada el cliente dijo "a lo mejor llegan unos 220". No está confirmado por escrito.

  Servicios:

  - Día 1: refrigerio AM 10:00–10:30; almuerzo tipo bufé 12:30–13:45; refrigerio PM 15:30–16:00.

  - Día 2: refrigerio AM 10:00–10:30; almuerzo tipo bufé 12:30–13:45. Cierre a las 14:30, sin refrigerio PM.

  Acceso y montaje:

  - No hay cocina en el salón, solo un área de apoyo con agua y tomas eléctricas. La capacidad eléctrica está por confirmar
  con la sede.

  - Los proveedores ingresan por la bahía de carga de la Calle Ejemplo, de 6:00 a 9:00. Prohibido descargar sobre el andén.

  - Hay montacargas hasta el piso 3.

  - El montaje debe estar listo 30 minutos antes de cada servicio.

  - Retiro de todo el menaje: día 1 antes de las 19:00; día 2 antes de las 17:00.

  - La sede exige el listado del personal del proveedor para el control de acceso.

  Proveedores invitados:

  - Sabores Ejemplo S.A.S. (ficticia) – cotizaciones@sabores-ejemplo.test

  - Catering Muestra Ltda. (ficticia) – ventas@catering-muestra.test

  - Banquetes Prueba S.A.S. (ficticia) – comercial@banquetes-prueba.test

  Respuesta: hasta el viernes 6 de noviembre de 2026 a las 17:00 (hora de Colombia), a compras@eventos-ejemplo.test.

  Condiciones que queremos pedir:

  - Ajuste del número final hasta 72 horas antes de cada jornada.

  - Cancelación sin penalidad hasta 10 días calendario antes del evento.

  - Que informen su política de anticipo y de penalidades.

  Presupuesto: aún no aprobado por el cliente.

  Lista ficticia de asistentes con restricciones (tomada del formulario de inscripción; los asistentes NO autorizaron compartirla
  con terceros):

  1. Ana Exemplo – ana.exemplo@industrias-muestra.test – vegetariana – días 1 y 2

  2. Martin Exemple – martin.exemple@industrias-muestra.test – celiaquía, sin gluten – días 1 y 2

  3. Lucía Ejemplo – lucia.ejemplo@industrias-muestra.test – vegetariana – solo día 1

  4. Carlos Muestra – carlos.muestra@industrias-muestra.test – alergia grave al maní, antecedente de anafilaxia, porta autoinyector
  de adrenalina – días 1 y 2

  5. Sofía Prueba – sofia.prueba@industrias-muestra.test – vegetariana y sin gluten – días 1 y 2

  6. Jorge Ficticio – jorge.ficticio@industrias-muestra.test – sin gluten – solo día 2

  7. Valeria Ejemplo – valeria.ejemplo@industrias-muestra.test – vegetariana – días 1 y 2

  El resto de asistentes no declaró restricciones.

  '
