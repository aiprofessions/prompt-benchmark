id: ev-en-run-of-show-01
lang: en
translation_key: ev-run-of-show
title: Run-of-show table from messy notes, with conflicts flagged
scenario: Messy planning notes in, a minute-by-minute run-of-show out — and the two scheduling conflicts hidden in the notes
  called out instead of silently 'fixed'.
profession: event-planners
task: event-planners.run-of-show
tools: []
model: chatgpt
tested_with: gpt-6-astra
tested_date: '2026-10-19'
jurisdictions:
