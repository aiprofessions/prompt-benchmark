prompt: 'Vous assistez un avocat en droit des contrats en France, conseil d’une SAS cliente. Revoyez l’accord de confidentialité
  selon les consignes de négociation fournies.

  1. Présentez un tableau Clause | Problème | Risque | Rédaction proposée : une ligne par clause qui s’écarte des consignes,
  avec une rédaction française prête à insérer, de 80 mots maximum.

  2. Signalez les contradictions entre l’accord et les échanges ; distinguez les affirmations non vérifiées du contenu fourni
  et indiquez les versions ou pièces à vérifier, sans arbitrer à la place du client.

  3. Dans « Ce qui manque », relevez les clauses exigées mais absentes des documents fournis et expliquez leur utilité dans
  ce dossier (150 mots maximum).

  4. Indiquez les points que l’avocat doit vérifier avant l’envoi (5 puces maximum), notamment les informations manquantes
  et les rôles des parties lorsque les consignes en dépendent.

  Utilisez uniquement les données fournies ; les consignes du client sont des positions contractuelles, non des affirmations
  sur le droit applicable.

  Ne formulez aucune affirmation réglementaire et ne citez aucun texte de loi, aucune jurisprudence ni aucune norme ; n’inventez
  aucun fait, montant, prix, date ou durée.

  Distinguez ce qui manque dans les extraits de ce qui reste à vérifier dans l’accord complet ; ne supposez pas les informations
  absentes.

  Ne garantissez ni la validité des clauses ni l’issue de la négociation ; indiquez que la version finale doit être validée
  par un avocat avant l’envoi.

  Données (consignes de négociation, accord, échanges) :

  [Collez les consignes du client, l’accord reçu et les échanges utiles, en anonymisant les parties, les personnes, les coordonnées
  et les identifiants]

  '
sample_input: 'DOSSIER ENTIÈREMENT FICTIF

  Client : Exemple Robotique SAS (fictive), SIREN fictif 000 000 000, Lyon. Contact : Martin Exemple, directeur juridique
  fictif (martin.exemple@exemple-robotique.test).

  Contrepartie : Northbridge Exemplo Ltd (fictive), Londres. Contact : Ana Exemplo, interlocutrice fictive (ana.exemplo@northbridge.test).

  Objet : évaluation d’un partenariat de maintenance prédictive, avec un pilote prévu sur 3 sites clients.


  CONSIGNES DE NÉGOCIATION DU CLIENT

  Ces consignes expriment les exigences contractuelles du client, sans prétendre décrire les obligations légales.

  P1. Définition : elle couvre les informations écrites sans condition de marquage, ainsi que les informations orales confirmées
  par écrit dans les 30 jours.

  P2. Durée des obligations : 5 ans.

  P3. Responsabilité : aucun plafond pour la violation de l’obligation de confidentialité.

  P4. Destinataires : communication limitée aux personnes qui ont besoin d’en connaître, et chacune d’elles doit avoir pris
  un engagement écrit de confidentialité.

  P5. Si des données personnelles sont échangées, le client exige une clause de protection des données personnelles, dite
  « clause RGPD ». Il exige aussi des stipulations de sous-traitance si les rôles des parties le justifient ; cette qualification
  reste à vérifier.

  P6. Loi française, compétence des tribunaux de Paris.

  P7. Restitution ou destruction des informations en fin de relation ou à première demande.


  ACCORD REÇU (version française transmise par la contrepartie, extraits)

  Art. 1 – « Informations confidentielles » désigne les informations transmises par écrit par une Partie et portant la mention
  « Confidentiel ».

  Art. 3 – Le Destinataire peut communiquer les Informations confidentielles à toute société de son groupe ainsi qu’à ses
  sous-traitants.

  Art. 5 – Les obligations du présent accord s’appliquent pendant 1 an à compter de sa signature.

  Art. 7 – La responsabilité totale de chaque Partie au titre du présent accord est plafonnée à 5 000 €.

  Art. 9 – Le présent accord est régi par le droit anglais. Les tribunaux de Londres sont seuls compétents.

  Art. 10 – Divers : intégralité de l’accord, notifications par e-mail.


  ÉCHANGES

  E-mail d’Ana Exemplo (12/10/2026) : « Comme convenu en réunion, nous avons relevé le plafond de responsabilité à 50 000
  € dans la version jointe. Pour le pilote, vous nous transmettrez l’export de votre base de maintenance : noms, e-mails et
  numéros de téléphone des 2 000 techniciens de vos clients, ainsi que l’historique des interventions. Merci de signer d’ici
  vendredi. »

  Note interne de Martin Exemple : « Présentations orales de notre algorithme prévues le 4 novembre, puis démonstrations sur
  site. »

  '
