id: sm-fr-revue-pipeline-01
lang: fr
translation_key: sm-pipeline-review
title: Revue trimestrielle du pipeline commercial et des affaires à risque
scenario: 'Six opportunités du trimestre : obtenez le pipeline pondéré recalculé, l’écart à l’objectif, les affaires à risque
  et les questions à poser à chaque commercial.'
profession: sales-managers
task: sales-managers.pipeline-review
tools: []
model: chatgpt
tested_with: gpt-6-astra
tested_date: '2026-10-19'
jurisdictions:
- FR
prompt: 'Vous préparez une revue trimestrielle du pipeline commercial en France à partir des seules données ci-dessous.

  1. Présentez un tableau par opportunité : client, commercial, montant HT, étape, probabilité et montant pondéré (montant
  × probabilité), puis les totaux brut et pondéré.

  2. Calculez l’écart à l’objectif : objectif − déjà signé − pipeline pondéré ; détaillez le calcul et quantifiez les éventuelles
  incohérences entre vos résultats et les données fournies.

  3. À la date de revue, relevez les signatures prévues à une date dépassée et les affaires sans activité depuis plus de 30
  jours ; indiquez les dates concernées et les jours d’inactivité écoulés.

  4. Posez 2 à 4 questions par commercial, chacune clairement rattachée à ses affaires nommées : prochaine étape datée, décideur
  ou date de signature réaliste, selon les besoins.

  5. Signalez les informations manquantes, incohérentes ou non confirmées et les points restant à vérifier par le responsable
  commercial.

  Pour les calculs, retenez toutes les opportunités de l’export, même si leur signature prévue est dépassée ou hors trimestre,
  avec leurs montants et probabilités saisis ; distinguez ce calcul d’une prévision à valider.

  Vérifiez les données et les calculs ; présentez séparément les informations non confirmées sans les substituer aux valeurs
  de l’export. N’inventez aucun fait, montant, date, probabilité ou activité ; les résultats calculés et les questions doivent
  être clairement identifiables comme tels.

  Ne formulez aucune affirmation réglementaire et ne garantissez pas l’atteinte de l’objectif. Terminez en précisant que le
  responsable commercial doit valider les chiffres avant diffusion.

  Limitez le texte hors tableau à 500 mots maximum. Présentez les montants en euros, au format français, et vouvoyez vos interlocuteurs.

  Données de la revue :

  [Collez la période, la date de revue, l’objectif, le montant déjà signé et les opportunités avec montant HT, étape, probabilité,
  signature prévue, dernière activité et commercial ; anonymisez clients et personnes]

  '
