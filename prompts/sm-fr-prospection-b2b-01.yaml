id: sm-fr-prospection-b2b-01
lang: fr
translation_key: sm-cold-email
title: E-mail de prospection B2B pour un logiciel de maintenance, sans chiffres inventés
scenario: À partir de notes de salon, rédigez un e-mail court et personnalisé à un directeur d’usine, avec un seul appel à
  l’action, un cas client autorisé et une mention d’opposition.
profession: sales-managers
task: sales-managers.outreach
tools: []
model: chatgpt
tested_with: gpt-6-astra
tested_date: '2026-10-19'
jurisdictions:
- FR
prompt: 'Agissez comme un responsable commercial B2B en France. Rédigez un premier e-mail de prospection pour un logiciel
  de maintenance (GMAO) à partir des notes ci-dessous.

  1. Destinataire : indiquez l’adresse e-mail professionnelle fournie.

  2. Objet : 8 mots maximum.

  3. Corps : 120 mots maximum, mention d’opposition comprise, hors objet et signature. Vouvoyez le destinataire et utilisez
  au moins deux éléments précis de son contexte ou de ses besoins.

  Intégrez le cas client explicitement autorisé. Retenez un seul appel à l’action commercial parmi les propositions des notes.

  Terminez le corps par une mention permettant de s’opposer à recevoir d’autres messages, avec le lien fourni ou une réponse
  « STOP » ; cette mention ne compte pas comme un appel à l’action commercial.

  4. Hors e-mail, en 80 mots maximum : expliquez les exclusions, signalez les informations manquantes et indiquez les vérifications
  et la validation humaine nécessaires avant l’envoi.

  Utilisez uniquement les notes : n’inventez aucun fait, chiffre, date, créneau, client, prix ou résultat. Écartez les affirmations
  non validées. Pour une information nécessaire mais absente, indiquez [à compléter].

  En prospection B2B par e-mail, les personnes doivent être préalablement informées et pouvoir s’opposer ; rappelez de vérifier
  ces points avant l’envoi. N’ajoutez aucune règle juridique, référence légale, jurisprudence, norme ou sanction.

  Pour les limites de longueur, comptez comme un mot chaque élément séparé par des espaces ; une adresse ou une URL compte
  pour un mot.

  Notes du commercial :

  [Collez vos notes sur le prospect, le produit, le cas client autorisé et le moyen d’opposition ; anonymisez les noms, adresses
  et coordonnées]

  '
sample_input: 'Toutes les personnes, entreprises, coordonnées et situations ci-dessous sont fictives.

  Prospect : Jean-Luc Exemple, directeur d’usine, Exemple Plasturgie (fictive), SIREN 000 000 000, usine de 85 salariés.

  E-mail professionnel : jl.exemple@exemple-plasturgie.test

  Contexte : rencontré le 2 octobre 2026 au salon (fictif) Industrie Exemple. L’usine a 3 lignes d’extrusion. Les arrêts non
  planifiés sont suivis sur un tableur et des fiches papier. La maintenance repose sur 4 techniciens. Sa priorité : préparer
  l’audit d’un client donneur d’ordres en janvier.

  Produit : Exemplo Maint (fictif). Bons de travail sur mobile, historique par machine, plan de maintenance préventive.

  Cas client AUTORISÉ (accord écrit) : Fonderie Martin Exemple (fictive) a remplacé ses fiches papier par des bons de travail
  sur mobile. Citation autorisée : « Nos techniciens saisissent les interventions directement au pied de la machine. » Aucun
  chiffre autorisé.

  Note du marketing : « On réduit les pannes de 40 % en moyenne, tu peux le mettre » (chiffre pas encore validé).

  Idée du manager : « Propose-lui une démo de 20 min, le webinaire du 12/11 et l’essai gratuit de 30 jours. »

  Lien d’opposition : https://exemplo-maint.test/opposition

  Signature : Ana Exemplo, responsable commerciale, Exemplo Maint (fictive).

  '
